<style>

lkiyet durumu farklı olabilir.\n\nİstanbul'un kuzeyinde, Boğaz kıyısından orman dokusuna uzanan Beykoz; daire, müstakil ev, villa, arsa ve yeniden geliştirme fırsatlarını bir arada barındırır. Bu çeşitlilik ilçeyi cazip kılarken, her taşınmaz için ayrı ve dikkatli inceleme yapılmasını da gerekli hale getirir.\n\nBu rehberde Beykoz'da gayrimenkul alım satım sürecini, mahallelerin genel karakterini, ev ve arsa alırken kontrol edilmesi gerekenleri ve mülk sahiplerinin değerlendirebileceği seçenekleri bulabilirsiniz.\n\n## Beykoz emlak piyasasını tanımak\n\nBeykoz tek tip bir gayrimenkul bölgesi değildir. Boğaz hattındaki yerleşimler, merkez çevresi, Kavacık'ın ulaşım ve ticaret odaklı yapısı, Çavuşbaşı çevresindeki daha düşük yoğunluklu yerleşimler ve Riva yönündeki gelişim alanları birbirinden farklı beklentilere hitap eder. Bu nedenle yalnızca “Beykoz'da ev” aramak yerine, yaşam biçiminizi, ulaşım ihtiyacınızı, taşınmazın kullanım amacını ve bütçenizi birlikte düşünmelisiniz.\n\nMahalle adı tek başına bir taşınmazın değerini veya yapılaşma hakkını belirlemez. Konum, sokak, manzara, ulaşım bağlantısı, binanın yaşı, arsa payı, imar planı ve tapu kayıtları birlikte incelenmelidir.\n\n## Beykoz'un öne çıkan bölgeleri\n\n### Kavacık\n\nKavacık, Fatih Sultan Mehmet Köprüsü bağlantısı ve ana ulaşım akslarına yakınlığıyla Beykoz'un önemli merkezlerinden biridir. Konutların yanı sıra ofis, ticaret ve günlük hizmetlerin bulunduğu bir bölgedir. Daire arayanlar için ulaşım ve günlük ihtiyaçlara erişim öne çıkarken, mülk sahipleri açısından binanın yaşı, otopark, yapı kalitesi, arsa payı ve mevcut imar koşulları önem taşır.\n\nKavacık'ta eski bir apartman veya müstakil bina değerlendirilirken yalnızca mevcut kira ya da satış beklentisine bakılmamalıdır. Binanın teknik durumu, parsel özellikleri ve varsa yeniden geliştirme ihtimali ayrıca incelenmelidir.\n\n### Çubuklu ve Paşabahçe\n\nÇubuklu ve Paşabahçe, Boğaz kıyısı ve çevresindeki yerleşim dokusuyla öne çıkar. Deniz ulaşımı, sahile yakınlık, manzara ve çevresel özellikler bazı taşınmazlar için önemli tercih unsurlarıdır. Bununla birlikte Boğaziçi alanı, koruma kararları ve yürürlükteki plan hükümleri nedeniyle her parselin durumu kendi içinde değerlendirilmelidir.\n\nBir evin veya arsanın Boğaz'a yakın olması, otomatik olarak belirli bir inşaat hakkına sahip olduğu anlamına gelmez. Satın alma öncesinde güncel imar durumu, plan notları ve tapu kayıtları kontrol edilmelidir.\n\n### Beykoz Merkez ve çevresi\n\nBeykoz Merkez ve çevresinde yerleşik mahalle dokusu, günlük ihtiyaçlara erişim ve ulaşım seçenekleri öne çıkar. Apartman daireleri, eski yapılar ve müstakil konutlar farklı alıcı profillerine hitap eder. Özellikle yaşı ilerlemiş binalarda deprem performansı, bakım geçmişi, yapı ruhsatı, iskân ve ortak alanların durumu dikkatle incelenmelidir.\n\n### Çavuşbaşı\n\nÇavuşbaşı çevresinde daha geniş parseller, müstakil konutlar ve düşük yoğunluklu yerleşim özellikleriyle karşılaşılabilir. Ancak geniş bir bahçeye veya büyük bir parsele sahip olmak, parselin tamamında yapılaşma yapılabileceği anlamına gelmez. Orman sınırı, plan fonksiyonu, koruma kararları, yola cephe ve altyapı gibi konular mutlaka kontrol edilmelidir.\n\n### Riva ve Polonezköy çevresi\n\nRiva ve Polonezköy çevresi, doğayla iç içe yaşam arayanların ilgisini çekebilir. Bu bölgelerde taşınmazın niteliği, imar planındaki kullanım kararı, doğal ve çevresel koruma statüleri ile altyapı koşulları özellikle önemlidir. İlanlarda kullanılan “villa imarlı”, “yatırımlık arsa” veya “müstakil yaşam” gibi ifadeler resmî belge yerine geçmez.\n\n## Beykoz'da satılık daire alırken nelere dikkat edilmeli?\n\nBir daireyi değerlendirirken yalnızca oda sayısı, manzara veya iç dekorasyon üzerinden karar vermeyin. Aşağıdaki kontroller, taşınmazın hukuki ve fiziksel durumunu daha doğru anlamanıza yardımcı olur:\n\n• **Tapu ve mülkiyet:** Tapu türünü, malik bilgilerini, bağımsız bölüm numarasını, arsa payını ve tapudaki şerh, beyan ve ipotek kayıtlarını kontrol edin.\n\n• **İskân ve ruhsat:** Yapı ruhsatı ile yapı kullanma izin belgesinin (iskân) bulunup bulunmadığını ve mevcut kullanımın belgelerle uyumunu araştırın.\n\n• **Binanın yaşı ve teknik durumu:** Taşıyıcı sistem, bakım-onarım geçmişi, ortak alanlar, tesisat, çatı, cephe ve varsa güçlendirme kayıtları hakkında bilgi alın. Gerekli durumlarda uzman teknik inceleme yaptırın.\n\n• **Aidat ve ortak giderler:** Apartman veya site yönetiminden güncel aidat tutarını, işletme bütçesini, planlanan bakım giderlerini ve varsa ortak alan sorunlarını öğrenin.\n\n• **Konum ve erişim:** Toplu taşıma, ana yollar, otopark, okul, sağlık hizmetleri ve günlük ihtiyaçlara erişimi farklı saatlerde değerlendirin.\n\n• **Gerçekçi fiyat karşılaştırması:** Yalnızca ilan fiyatlarını değil, benzer özellikteki taşınmazların konum, bina yaşı, kat, cephe ve hukuki durum farklarını da dikkate alın.\n\n## Beykoz'da villa veya müstakil ev alırken\n\nVilla ve müstakil evlerde parselin kendisi, binanın iç özellikleri kadar önemlidir. Bahçe büyüklüğü, manzara veya havuz gibi özellikler cazip olabilir; ancak satın alma kararından önce şu başlıklar incelenmelidir:\n\n• Tapu niteliği ve parsel sınırları, mümkünse aplikasyon bilgileri\n• Yapı ruhsatı, iskân ve projeye uygunluk\n• Sonradan yapılan kapalı alan, eklenti veya tadilatların yasal durumu\n• İmar planı, plan notları ve varsa koruma kısıtları\n• Orman, kıyı, sit veya diğer koruma sınırlarıyla ilişkisi\n• İstinat duvarı, eğim, drenaj, yol ve altyapı koşulları\n• Isıtma, yalıtım, çatı, su yalıtımı ve bakım maliyetleri\n\nÖzellikle Beykoz'da manzaralı veya ormana yakın bir ev incelenirken, çevredeki yapıların varlığı aynı parselde de aynı hakların bulunduğunu göstermez. Her taşınmaz için resmî kayıt ve belgeler esas alınmalıdır.\n\n## Beykoz'da arsa alırken imar ve tapu kontrolü\n\nArsa alımında ilk adım, taşınmazın ada ve parsel bilgilerini doğru şekilde belirlemektir. Ardından güncel tapu kaydı ve ilgili idarelerden alınacak imar bilgileri birlikte değerlendirilmelidir.\n\nKontrol edilmesi gereken temel konular şunlardır:\n\n1. **Tapu niteliği:** Tapuda arsa, tarla, bahçe veya başka bir nitelik yazması tek başına yapılaşma hakkını göstermez.\n2. **Plan fonksiyonu:** Parselin konut, ticaret, tarım, yeşil alan, orman veya başka hangi kullanım kararında kaldığını öğrenin.\n3. **Yapılaşma koşulları:** Emsal, TAKS, kat adedi, yükseklik, çekme mesafeleri ve plan notlarını inceleyin.\n4. **Koruma ve kısıtlar:** Boğaziçi alanı, doğal veya kentsel sit, orman, kıyı ve diğer özel mevzuat kapsamlarını araştırın.\n5. **Yol ve altyapı:** Parselin yola cephesini, yasal erişimini ve elektrik, su, kanalizasyon gibi altyapı koşullarını kontrol edin.\n6. **Hisseli mülkiyet:** Pay oranlarını, diğer paydaşları ve varsa önalım (şufa) hakkı gibi hukuki riskleri değerlendirin.\n\nBeykoz'da imar yetkisi ve planlama süreçleri taşınmazın bulunduğu alana ve yürürlükteki planlara göre farklı idareleri ilgilendirebilir. Bu nedenle yalnızca çevrim içi harita görüntüsüne veya sözlü bilgiye dayanarak karar vermeyin; ilgili belediye ve yetkili kurumlardan güncel, resmî bilgi alın.\n\n## Beykoz'da eski bina veya apartman için kat karşılığı değerlendirme\n\nBeykoz'da bazı mülk sahipleri, mevcut daire veya binayı satmak yerine arsa payı karşılığı yeni bir proje geliştirme seçeneğini değerlendirmek isteyebilir. Bu seçeneğin uygun olup olmadığı yalnızca binanın eski olmasına veya parselin büyük görünmesine göre belirlenemez.\n\nİlk değerlendirmede şu başlıklar birlikte ele alınmalıdır:\n\n• Parselin tapu ve mülkiyet yapısı\n• Güncel imar durumu ve plan notları\n• Mevcut binanın ruhsat, iskân ve teknik durumu\n• Parselde hukuken ve fiilen geliştirilebilecek alan\n• İnşaat maliyetleri, proje süresi ve finansman koşulları\n• Müteahhit firmanın mali yeterliliği ve tamamladığı işler\n• Arsa sahiplerine önerilen bağımsız bölüm dağılımı ve sözleşme şartları\n\nKat karşılığı teklifleri karşılaştırırken yalnızca “kaç daire verilecek?” sorusuna odaklanmayın. Bağımsız bölümlerin konumu, büyüklüğü, net alanı, teslim standardı, teminatlar, gecikme hükümleri ve sözleşmedeki yükümlülükler de önemlidir. Herhangi bir sözleşme imzalanmadan önce teknik ve hukuki uzmanlardan destek alınmalıdır.\n\n## Beykoz'da gayrimenkulün değeri nasıl belirlenir?\n\nBir taşınmazın değerini tek bir ilan veya metrekare fiyatı üzerinden belirlemek sağlıklı değildir. Değerleme çalışmasında emsal satışlar, konum, imar ve tapu durumu, yapı kalitesi, taşınmazın kullanım şekli ve pazardaki talep birlikte değerlendirilir.\n\nDairelerde kat, cephe, manzara, bina yaşı, otopark ve aidat; villalarda parsel büyüklüğü, bahçe kullanımı, yapı ruhsatı ve bakım durumu; arsalarda ise imar hakkı, mülkiyet yapısı, yola erişim ve kısıtlar öne çıkar.\n\nSatışa çıkmadan önce doğru fiyat aralığını belirlemek, gereksiz uzun ilan süresini ve yanlış beklentileri azaltmaya yardımcı olur. Piyasa koşulları değişebileceği için değerlendirme güncel ve karşılaştırılabilir verilerle yapılmalıdır.\n\n## Beykoz emlak danışmanı seçerken nelere bakılmalı?\n\nGayrimenkul danışmanıyla çalışırken yalnızca ilan verme veya alıcı bulma hizmetini değil, sürecin nasıl yönetileceğini de sorgulayın. Bölgeyi tanıması, taşınmazın belgelerini doğru okumaya önem vermesi, fiyat önerisini gerekçelendirmesi ve süreç boyunca açık iletişim kurması önemlidir.\n\nMülkünüzü satmayı, satın almayı veya yeniden geliştirme potansiyelini değerlendirmeyi düşünüyorsanız ilk görüşmede taşınmazın konumunu, ada-parsel bilgisini, tapu niteliğini ve mevcut durumunu paylaşmanız ön değerlendirmeyi kolaylaştırır.\n\n## Sık sorulan sorular\n\n### Beykoz'da emlak alırken ilk hangi belge kontrol edilmeli?\n\nÖncelikle taşınmazın güncel tapu kaydı ve ada-parsel bilgileri incelenmelidir. Arsa, villa veya bina için kullanım amacına göre güncel imar durumu, ruhsat ve iskân belgeleri de kontrol edilmelidir.\n\n### Beykoz'da arsa almak mı, daire almak mı daha avantajlı?\n\nBu sorunun herkes için geçerli tek bir cevabı yoktur. Kullanım amacı, bütçe, yatırım süresi, taşınmazın hukuki durumu, bakım ihtiyacı ve risk toleransı birlikte değerlendirilmelidir. Arsa alımında imar ve mülkiyet incelemesi özellikle önemlidir.\n\n### Beykoz'da her arsaya ev yapılabilir mi?\n\nHayır. Tapuda arsa veya tarla yazması tek başına yapılaşma hakkı sağlamaz. Parselin yürürlükteki imar planı, plan notları, koruma kararları ve ilgili mevzuat kapsamında incelenmesi gerekir.\n\n### Beykoz'da eski apartman binası kat karşılığı verilebilir mi?\n\nBazı parsellerde bu seçenek değerlendirilebilir; ancak uygunluk güncel imar haklarına, mülkiyet yapısına, teknik koşullara, maliyetlere ve müteahhit teklifine bağlıdır. Önce parsel bazında fizibilite yapılmalıdır.\n\n### Beykoz emlak danışmanlığı için hangi bilgiler gerekir?\n\nİlk görüşme için taşınmazın mahalle veya açık konumu, taşınmaz türü, yaklaşık büyüklüğü ve varsa ada-parsel bilgisi yararlı olur. Tapu ve imar belgeleri ise ayrıntılı değerlendirme aşamasında incelenir.\n\n## Sonuç: Beykoz'da doğru gayrimenkul kararı, doğru incelemeyle başlar\n\nBeykoz emlak piyasasında daire, villa veya arsa alırken bölgeyi tanımak kadar taşınmazın kendi özelliklerini ve resmî kayıtlarını incelemek de önemlidir. Mülk sahipleri için de satış, kiralama veya kat karşılığı proje geliştirme seçenekleri aynı veriler üzerinden, gerçekçi bir değerlendirmeyle karşılaştırılmalıdır.\n\nBen Meftun Özdemir. Beykoz ve çevresindeki gayrimenkullerin satış, alım ve proje geliştirme potansiyelini değerlendirmek için benimle iletişime geçebilirsiniz. İlk görüşmede taşınmazın konumunu ve temel bilgilerini paylaşmanız, nasıl bir yol izlenebileceğini birlikte değerlendirmemize yardımcı olur.\n\nBu içerik genel bilgilendirme amacı taşır. İmar, tapu ve hukuki konularda nihai karar öncesinde ilgili resmî kurumlardan güncel belge alınmalı; gerektiğinde şehir plancısı, mimar, mühendis ve hukuk uzmanlarından destek istenmelidir.","alt":"","img":"","video":""},{"id":"beykoz-imar-durumu-kontrolu","title":"Beykoz'da Arsa ve Villa Alırken İmar Durumu Nasıl Kontrol Edilir?","cat":"Alıcılar","date":"2026-10-18","summary":"Beykoz'da arsa veya villa almadan önce imar durumunu nasıl sorgularsınız? Koruma alanı, tapu ve şerh kontrolü için adım adım rehber.","body":"Beykoz'da arsa veya villa almadan önce imar durumunu üç kaynaktan birlikte kontrol etmelisiniz: ilgili belediyeden alacağınız imar durumu belgesi, güncel tapu kaydı ve taşınmazın koruma alanı içinde kalıp kalmadığı bilgisi. Bu üçü birbirini tamamladığı için biri eksik kalırsa satın alma kararı riskli hale gelir.\n\nBeykoz, Boğaz hattı, geniş orman alanları ve koruma amaçlı planları nedeniyle İstanbul'un imar açısından en dikkat isteyen ilçelerinden biridir. Aynı mahallede yan yana iki parselin yapılaşma koşulları bile birbirinden farklı olabilir. Bu rehberde kontrol sırasını, Beykoz'a özgü dikkat noktalarını ve en sık yapılan hataları bulacaksınız.\n\n## İmar Durumu Nedir ve Neden Önemlidir?\n\nİmar durumu, bir parselde ne yapılabileceğini belirleyen resmî bilgidir. Belediyenin verdiği imar durumu belgesinde genellikle şu bilgiler yer alır:\n\n• Parselin plan fonksiyonu (konut, ticaret, yeşil alan, tarım, koruma alanı vb.)\n• Emsal ve taban alanı oranları (yapılaşma yoğunluğu)\n• İzin verilen kat adedi ve yapı yüksekliği\n• Çekme mesafeleri (komşu parsel ve yola uzaklık)\n\nBu bilgileri bilmeden alınan bir arsada hayal ettiğiniz villa yapılamayabilir ya da çok daha küçük bir yapıya izin çıkabilir.\n\n## Beykoz'da İmar Durumunu Adım Adım Kontrol Etme\n\n1. Ada ve parsel numarasını öğrenin\nSatıcıdan veya tapu senedinden mahalle, ada ve parsel bilgisini alın. Her kontrol bu bilgiye dayanır.\n\n2. Güncel tapu kaydını inceleyin\nTapunun nitelik bölümünü (arsa, tarla, bahçe vb.) ve \"şerhler, beyanlar, rehinler\" kısmını okuyun. İpotek, haciz, irtifak hakkı veya kısıtlama varsa not alın.\n\n3. İmar durumu belgesini belediyeden alın\nBeykoz Belediyesi imar birimine ada ve parsel bilgisiyle başvurarak resmî imar durumu belgesini isteyin. İlandaki veya emlak ofisindeki sözlü bilgiyle yetinmeyin.\n\n4. Plan türünü ve koruma durumunu sorgulayın\nParselin hangi plana tabi olduğunu, Boğaziçi Kanunu veya kıyı mevzuatı kapsamında bir bölgede kalıp kalmadığını öğrenin. Koruma amaçlı planlarda yapılaşma koşulları çok daha sınırlıdır.\n\n5. Orman ve tarım arazisi kontrolü yapın\nBeykoz'da orman alanına komşu veya orman sınırına yakın parseller çoktur. Parselin orman sınırı içinde kalmadığından ve tarım vasfında olup olmadığından emin olun.\n\n6. Mevcut yapı varsa ruhsat ve iskân belgesini isteyin\nArsa üzerinde bina varsa yapı ruhsatı ve iskân (yapı kullanma izin belgesi) olup olmadığını kontrol edin. Belgesiz yapılar ileride yıkım, para cezası veya satış zorluğu yaratabilir.\n\n## Boğaz Koruma Alanı Neden Ayrı Bir Kontrol Gerektirir?\n\nBoğaz hattındaki parseller Boğaziçi Kanunu ve koruma amaçlı imar planlarına tabidir. Sahil şeridi, ön görünüm, arka görünüm ve etkilenme bölgeleri gibi alt bölgelerde izin verilen yapı türü, yükseklik ve arazi kullanımı birbirinden farklıdır. Kıyıya yakın parsellerde ayrıca kıyı mevzuatından doğan yapı yasakları olabilir.\n\nBu nedenle \"komşunun villası var, bende de yapılır\" düşüncesi risklidir. Her parselin planı ve ilgili koruma kurulu kararları ayrı ayrı incelenmelidir.\n\n## Alıcıların En Sık Yaptığı Hatalar\n\n• Sadece ilandaki bilgiye veya sözlü beyana güvenmek\n• İmar durumu belgesi almadan kapora veya senet vermek\n• Tarla vasıflı arazinin kolayca konuta çevrilebileceğini varsaymak\n• Tapudaki şerh ve beyan bölümünü okumamak\n• Hisseli tapunun kendi payı için ayrı bir yapılaşma hakkı vermediğini bilmemek\n• Koruma alanı ve orman sınırı kontrolünü atlamak\n\n## Beykoz'da imar durumu belgesi nereden alınır?\n\nİmar durumu belgesi, taşınmazın bulunduğu ilçenin belediyesinin imar ve şehircilik birimlerinden alınır. Beykoz'daki parseller için Beykoz Belediyesi'ne ada ve parsel bilgisiyle başvurmanız gerekir. Bazı bilgiler belediye ve bakanlığın çevrim içi sorgulama hizmetlerinden de görülebilir ama bağlayıcı olan resmî belgedir.\n\n## Boğaz koruma alanında villa yapılabilir mi?\n\nBu tamamen parselin hangi bölgede kaldığına ve geçerli koruma planına bağlıdır. Boğaziçi Kanunu kapsamındaki bölgelerde yapılaşma ciddi şekilde sınırlıdır, bazı parsellerde ise yeni yapı izni hiç verilmeyebilir. Satın almadan önce imar durumu belgesi ve plan notları mutlaka incelenmelidir.\n\n## Tarla vasıflı arazide ev yapılabilir mi?\n\nGenel kural olarak tarım arazilerinde konut yapımı sıkı şartlara bağlıdır ve her tarla için izin verilmez. Tapuda \"tarla\" yazması yapılaşma hakkı anlamına gelmez. Parselin imar planı içinde olup olmadığını ve yapılaşmaya izin verip vermediğini ilgili kurumlardan öğrenin.\n\n## Tapuda şerh ve beyan olması ne anlama gelir?\n\nŞerhler ve beyanlar, taşınmaz üzerindeki kısıtlamaları, haklar ve yükümlülükleri gösterir. İpotek, haciz, irtifak veya imar uygulamasına ilişkin kayıtlar buraya yazılabilir. Bunların satın alma sonrası size geçeceğini unutmayın, bu yüzden her kaydı anlayarak imzalayın.\n\n## Hisseli arsa alırken nelere dikkat edilmelidir?\n\nHisseli tapuda yalnızca belirli bir pay satın alırsınız, arsanın fiziken ayrılmış bir bölümünü değil. Payınıza düşen alanı pay ve payda oranından hesaplayabilirsiniz, ancak hangi bölümü kullanacağınız ortaklar arasındaki anlaşmayla veya ortaklığın giderilmesiyle belirlenir. Ayrıca hisseli satışlarda diğer paydaşların önalım (şufa) hakkı doğabilir, bu da satın alma sonrasında uyuşmazlık riski yaratır.\n\nBu yazı genel bilgilendirme amacıyla hazırlanmıştır ve yayın tarihi itibarıyla geçerlidir. İmar planları ve mevzuat değişebilir, bu nedenle satın almadan önce güncel imar durumu belgesini belediyeden almanız ve gerekirse bir avukata danışmanız önerilir. Beykoz'da bir arsa veya villa incelemek istiyorsanız benimle iletişime geçebilirsiniz.","alt":"","img":"","video":""},{"id":"beykoz-konut-piyasasi-2025-analizi","title":"Beykoz Konut Piyasası 2025 Analizi: %58,91 Değer Artışıyla Zirvede!","cat":"Piyasa Analizi","date":"2026-10-18","summary":"Beykoz %58,91 konut fiyat artışıyla İstanbul'un en çok kazandıran ilçesi oldu. Değer artışının nedenlerini ve yatırım fırsatlarını inceleyin.","body":"İstanbul gayrimenkul piyasasının gizli şampiyonu Beykoz, son dönemde kaydettiği rekor yükselişlerle adından sıkça söz ettiriyor. Endeksa verilerine göre Beykoz, geçtiğimiz yıl gerçekleştirdiği %58,91'lik konut fiyat artış hızı ile İstanbul'un en çok kazandıran ilçesi olmayı başardı.\n\nPeki, yatırımcıların ve konut alıcılarının odağındaki Beykoz'u bu kadar cazip kılan etkenler neler? Hangi bölgeler öne çıkıyor ve bu artışlar yatırımcılar için hâlâ bir fırsat mı?\n\n## Beykoz'u Zirveye Taşıyan Temel Faktörler\n\nİstanbul genelinde gayrimenkul projeleri hız kesmeden devam ederken Beykoz, sunduğu yaşam standartlarıyla diğer ilçelerden ayrışıyor. Bu yükseliş trendinin arkasında yatan başlıca dinamikler şunlar:\n\n• Zemin Sağlamlığı ve Güvenli Yaşam: Son yıllarda artan deprem bilinciyle birlikte, güvenli zemin yapısına sahip bölgelere olan talep katlanarak arttı. Beykoz, sağlam coğrafi yapısıyla güvenli bir yaşam arayanların ilk tercihi konumunda.\n• Müstakil Yaşam Konforu: Şehrin karmaşasından uzaklaşmak, doğayla iç içe, müstakil ve geniş alanlarda yaşamak isteyen nitelikli kitle, yatırımlarını bu bölgeye yönlendiriyor.\n• Eşsiz Boğaz Hattı ve Konum Avantajı: İstanbul Boğazı'nın benzersiz dokusunu yeşille buluşturan Beykoz, hem merkezi noktalara ulaşım kolaylığı hem de sakinliği bir arada sunuyor.\n\n## Hem Konut Hem Arsalar Değer Kazanıyor\n\nDoğayla iç içe, güvenli ve prestijli bir yaşam arayışının merkezinde yer alan Beykoz'da, sadece konutlar değil arsalar da yüksek oranda prim yapıyor. Doğru mahalle ve doğru lokasyon seçimiyle yapılan yatırımlar, kısa ve orta vadede yatırımcısına yüksek kazanç vadetmeye devam ediyor.\n\nMevcut piyasa koşullarında mülkünüzün gerçek değerini öğrenmek, doğru bir satış stratejisi oluşturmak veya Beykoz gayrimenkul piyasasındaki en güncel fırsatları değerlendirmek istiyorsanız benimle iletişime geçebilirsiniz. Gelin, mülkünüzün potansiyelini birlikte değerlendirelim.","alt":"","img":"","video":"https://www.youtube.com/watch?v=Roty7e-Y28Y"},{"id":"hisseli-tapu-metrekare-hesabi","title":"Hisseli Tapu Metrekare Hesabı Nasıl Yapılır?","cat":"Mülk Sahipleri","date":"2026-10-18","summary":"Hisseli tapuda pay ve payda hesaplama adımlarını öğrenin, toplam arsa alanınızdan size düşen net metrekareyi kolayca bulun.","body":"Gayrimenkul sahipleri için hisseli tapulardaki metrekare payını hesaplamak bazen karmaşık görünebilir. Kendi payınıza düşen net alanı bulabilmeniz için tapu belgenizdeki rakamların ne anlama geldiğini bilmeniz yeterlidir.\n\n## Hisseli Tapuda Pay ve Payda Mantığı\n\nTapu üzerindeki \"pay\" ve \"payda\" değerleri, toplam arsa içerisindeki mülkiyet oranınızı ifade eder:\n\n• Payda: Arsanın toplamda kaç eşit parçaya bölündüğünü gösterir.\n• Pay: Bu parçalardan kaç tanesinin size ait olduğunu belirtir.\n\n## Hisseli Tapu Metrekare Hesaplama Formülü\n\nKendi mülkiyet payınızı hesaplamak için kullanılan temel formül şu şekildedir:\n\n(Toplam Arsa Metrekaresi / Payda) x Pay = Net Hisse Alanınız (m²)\n\n## Adım Adım Örnek Hesaplama\n\nEğer toplam alanı 4.200 m² olan bir arsanız varsa ve tapunuzdaki oran 24 / 2500 olarak belirtilmişse, hesaplama şu şekilde yapılır:\n\n1. Bölme İşlemi: Toplam arsa alanını payda değerine bölün.\n4.200 / 2.500 = 1,68\n\n2. Çarpma İşlemi: Çıkan sonucu pay değeriniz ile çarpın.\n1,68 x 24 = 40,32 m² (Sizin net hisseniz)\n\nBu basit yöntem sayesinde herhangi bir hisseli tapuda kendi mülkiyet payınızı hızlıca hesaplayabilirsiniz.\n\n## Hisseli tapu metrekare hesabı fiili kullanım alanını garanti eder mi?\n\nHayır. Hisseli tapularda yapılan metrekare hesabı hukuki mülkiyet oranınızı gösterir. Arsanın hangi fiziki bölümünün size ait olduğu ancak hissedarlar arasında yapılan Rıza-i Taksim Sözleşmesi veya parselasyon ile netleşir.\n\n## Tapudaki değerleri hesaplamakta zorlanıyorsam ne yapmalıyım?\n\nEğer kendi tapunuzdaki değerleri hesaplamakta güçlük çekiyorsanız, arsa toplam metrekaresi ile pay ve payda bilgilerini paylaşarak profesyonel destek alabilir veya başkalarının deneyimlerinden faydalanabilirsiniz.","alt":"","img":"","video":""},{"id":"a1","title":"Gayrimenkul Değerleme Nasıl Yapılır?","cat":"Mülk Sahipleri","date":"2026-10-01","summary":"Doğru fiyatı belirlemenin 5 temel adımı.","body":"Doğru fiyat, satış sürecinin en kritik kararıdır.\n\n## 1. Emsal analizi\n\nBölgedeki benzer mülklerin gerçekleşen satış fiyatlarına bakın.\n\n## 2. Mülkün durumu\n\nYaş, cephe, kat, bakım durumu ve manzara değeri etkiler."},{"id":"a2","title":"Ev Alırken Dikkat Edilecek 7 Nokta","cat":"Alıcılar","date":"2026-09-20","summary":"Tapudan imara kadar kontrol listesi.","body":"Satın almadan önce tapu, iskan ve imar durumunu mutlaka kontrol edin.\n\n## Aidat ve giderler\n\nAylık sabit giderleri bütçenize dahil edin."},{"id":"a3","title":"Proje Satın Alırken Riskler ve Fırsatlar","cat":"Projeler","date":"2026-09-05","summary":"Müteahhit seçimi ve ödeme planı.","body":"Projeden alım, doğru yapıldığında güçlü bir yatırımdır.\n\n## Müteahhit geçmişi\n\nTamamlanmış projeleri yerinde inceleyin."},{"id":"arsa-payi-nasil-hesaplanir","title":"Arsa Payı Nasıl Hesaplanır? Kat Karşılığı Paylaşım Örneği","cat":"Mülk Sahipleri","date":"2026-11-24","summary":"Tapudaki arsa payı ile kat karşılığı paylaşım oranı arasındaki farkı öğrenin. Emsal, parsel alanı ve örnek hesaplamalarla tahmini dağılımı inceleyin.","body":"Arsa payı hesaplama konusu, gayrimenkul sahiplerinin en çok karıştırdığı iki ayrı hesabı kapsar: Tapuda kayıtlı mülkiyet payının parsel alanına oranı ve bir arsanın kat karşılığı projede arsa sahibi ile müteahhit arasında nasıl paylaşılabileceği. Bu iki hesap birbirinden farklıdır. İlkinde tapudaki pay ve payda kullanılır; ikincisinde ise imar koşulları, projelendirilebilir alan ve tarafların anlaşacağı paylaşım oranı dikkate alınır.\n\nBu sayfada temel hesaplama yöntemlerini ve örnekleri bulabilir, kendi bilgilerinizi **[Arsa Payı ve Kat Karşılığı Hesaplama Aracı](/arsa-payi-hesaplama/)** üzerinden deneyebilirsiniz. Sonuçların ön değerlendirme niteliğinde olduğunu unutmayın.\n\n## 1. Tapuda arsa payı nasıl hesaplanır?\n\nTapuda yer alan arsa payı, bağımsız bölümün ana taşınmazdaki ortak mülkiyet oranını gösterir. Pay ve payda bilgisi bir kesir gibi okunur. Bir bağımsız bölümün arsa payına karşılık gelen teorik alanı bulmak için toplam parsel alanı bu oranla çarpılır.\n\n**Formül:**\n\nToplam parsel alanı × (Arsa payı / Arsa paydası) = Arsa payına karşılık gelen alan\n\nÖrneğin toplam parsel alanı 1.000 m², tapudaki arsa payı 120/1.440 ise:\n\n1.000 × (120 / 1.440) = 83,33 m²\n\nBu sonuç, tapudaki pay oranının toplam parsel alanına matematiksel karşılığıdır. Arsanın belirli bir fiziksel bölümünün doğrudan size ait olduğu veya bu alana tek başınıza yapı yapabileceğiniz anlamına gelmez. Kat mülkiyeti ve ortak mülkiyet ilişkileri ayrıca değerlendirilmelidir.\n\n## 2. Kat karşılığı arsa payı paylaşımı nasıl hesaplanır?\n\nKat karşılığı ya da arsa payı karşılığı inşaatta arsa sahibi ile yüklenici arasında yapılacak paylaşım, tarafların sözleşmesi ve projenin fizibilitesi doğrultusunda belirlenir. İlk aşamada fikir vermesi için imar hesabına esas parsel alanı ile emsal (KAKS) çarpılarak teorik emsale esas alan bulunabilir.\n\n**Basit ön hesap formülü:**\n\nİmar hesabına esas parsel alanı × Emsal (KAKS) = Teorik emsale esas alan\n\nÖrneğin imar hesabına esas alan 1.000 m² ve emsal 1,50 ise:\n\n1.000 × 1,50 = 1.500 m² teorik emsale esas alan\n\nTarafların örnek olarak yüzde 50 - yüzde 50 paylaşım üzerinde anlaştığını varsayarsak, teorik dağılım her taraf için 750 m² olur. Bu yalnızca matematiksel bir örnektir; gerçek paylaşım oranı veya bağımsız bölüm dağılımı değildir.\n\n## 3. Emsal alanı, toplam inşaat alanı ve satılabilir alan aynı şey midir?\n\nHayır. Emsal (KAKS), imar planı ve ilgili mevzuat kapsamında emsale dahil edilen inşaat alanının hesaplanmasında kullanılan orandır. Toplam yapı inşaat alanı, emsal harici alanlar, ortak alanlar, teknik hacimler, merdiven ve asansör alanları gibi unsurlar nedeniyle farklılaşabilir. Net kullanım alanı ve satılabilir alan da ayrıca hesaplanır.\n\nBu nedenle yalnızca parsel alanı ve emsal bilgisiyle kesin daire sayısı, net metrekare veya satışa konu alan belirlenemez. Parselin güncel imar durumu, plan notları, terkler, çekme mesafeleri, TAKS, kat sınırı, yapı yaklaşma koşulları ve mimari çözüm birlikte incelenmelidir.\n\n## 4. Kat karşılığı paylaşım oranı nasıl belirlenir?\n\nArsa sahibi ve müteahhit arasında tek ve her parsel için geçerli bir paylaşım oranı yoktur. Oran; geliştirilebilir alan, konum, proje tipi, inşaat maliyeti, finansman, satış beklentisi, zemin ve altyapı koşulları, ruhsat süreci ve yüklenicinin üstleneceği riskler gibi birçok etkene bağlıdır.\n\nTeklifleri karşılaştırırken yalnızca yüzde oranına bakmak yeterli değildir. Arsa sahibine bırakılacak bağımsız bölümlerin konumu, cepheleri, net ve brüt alanları, otopark ve depo gibi eklentileri, teslim standardı, teminatlar, teslim süresi ve gecikme hükümleri de değerlendirilmelidir. Sözleşme öncesinde teknik ve hukuki uzman görüşü alınması önemlidir.\n\n## 5. Hesaplama yaparken hangi bilgilere ihtiyaç vardır?\n\nİlk ön değerlendirme için şu bilgiler yararlı olur:\n\n- Parselin toplam alanı ve mümkünse ada-parsel bilgisi\n- Tapudaki arsa payı ve payda (tapu payı hesabı yapılacaksa)\n- Güncel imar durumu ve emsal (KAKS)\n- TAKS, kat adedi, yükseklik ve çekme mesafeleri\n- Parseldeki mevcut yapı ve mülkiyet durumu\n- Varsa terk, irtifak, şerh veya diğer kısıtlamalar\n\nBeykoz ve İstanbul'daki parsellerde de aynı mahalledeki taşınmazların imar ve koruma koşulları farklı olabilir. Bu nedenle komşu parseldeki yapılaşma örneği, sizin parseliniz için aynı hakkın bulunduğunu göstermez. Güncel resmî imar belgesi ve tapu kayıtları esas alınmalıdır.\n\n## Sık sorulan sorular\n\n### Arsa payı ile kat karşılığı paylaşım oranı aynı mıdır?\n\nHayır. Tapudaki arsa payı, bağımsız bölümün ana taşınmazdaki mülkiyet oranını gösterir. Kat karşılığı paylaşım oranı ise yeni projede arsa sahibi ve yüklenici arasında yapılacak sözleşmesel paylaşımı ifade eder.\n\n### Emsal 1,50 ise arsanın 1,5 katı kadar daire yapılabilir mi?\n\nEmsal, doğrudan daire sayısını veya satılabilir alanı göstermez. İmar hesabına esas alanla çarpılarak teorik emsale esas alan bulunabilir; ancak proje alanı ve bağımsız bölüm sayısı diğer imar koşulları ve mimari tasarımla belirlenir.\n\n### Arsa payına karşılık gelen metrekare, benim kullanabileceğim bahçe alanı mıdır?\n\nHayır. Bu değer mülkiyet oranının parsel alanına matematiksel karşılığıdır. Fiziksel kullanım veya münhasır mülkiyet sınırı oluşturmaz.\n\n### Kat karşılığı yüzde kaç paylaşım yapılmalıdır?\n\nHer parsel için geçerli sabit bir oran yoktur. İmar hakları, proje maliyeti, satış potansiyeli, finansman ve sözleşme koşulları üzerinden fizibilite yapılmalıdır.\n\n## Arsanızın proje potansiyelini değerlendirin\n\nTapudaki payınızı veya kat karşılığı paylaşım senaryonuzu ilk aşamada görmek için **[Arsa Payı ve Kat Karşılığı Hesaplama Aracı](/arsa-payi-hesaplama/)** sayfasını kullanabilirsiniz.\n\nArsanızın ya da mevcut binanızın proje geliştirme potansiyelini daha ayrıntılı değerlendirmek isterseniz ada-parsel, parsel alanı ve imar bilgileriyle benimle iletişime geçebilirsiniz.\n\n**Meftun Özdemir – Gayrimenkul Danışmanı**\n\nBu içerik genel bilgilendirme amacı taşır. Hesaplamalar tahminidir; imar hakkı, yapılaşma koşulları, hukuki durum ve kesin proje alanı için yetkili idarelerden alınan güncel belgeler ve uzman proje incelemesi esas alınmalıdır."}],"listings":[{"id":"novo-city-izmir","kind":"proje","title":"NOVO CITY İZMİR","loc":"Torbalı, İzmir","price":"1.500.000 TL'den başlayan peşin fiyatlarla","desc":"Pancar OSB'ye komşu, Aydın–İzmir Otobanı'na cephe 1+0 ve 1+1 daire projesi. Açı return null}
function vbox(a){const v=vid(a.video);if(!v)return '';const n=v.k==='yt'?'YouTube':'Instagram';
return `<section class="vid"><h2 class="serif" style="font-size:24px;margin:30px 0 12px">Video</h2><div class="vwrap${v.k==='ig'?' ig':v.short?' vert':''}"><button class="vplay" data-src="${e(v.embed)}" data-t="${e(a.vtitle||a.title)}" onclick="playv(this)" aria-label="Videoyu oynat"><span>▶</span><small>${n} videosunu oynat</small></button></div><p style="margin:8px 0 0"><a href="${e(v.link)}" target="_blank" rel="noopener" style="color:var(--gold2)">Videoyu ${n}'da aç →</a></p></section>`}

function faq(b){const p=b.split(/\n\n+/),o=[];p.forEach((x,i)=>{if(x.startsWith('## ')&&x.trim().endsWith('?')&&p[i+1]&&!p[i+1].startsWith('## '))o.push({"@type":"Question","name":x.slice(3).trim(),"acceptedAnswer":{"@type":"Answer","text":p[i+1]}})});return o}

const art=x=>({"@type":"Article","headline":x.title,"description":x.summary,"datePublished":x.date,"dateModified":x.date,"articleSection":x.cat,"inLanguage":"tr","author":{"@id":"#agent"},"publisher":{"@id":"#agent"},"mainEntityOfPage":q.url?q.url+'/rehber/'+x.id:undefined});

else if(all)D.articles.forEach(x=>g.push(art(x)));

function meta(n,v,p){const k=p?'property':'name';let m=document.querySelector('meta['+k+'="'+n+'"]');if(!m){m=document.createElement('meta');m.setAttribute(k,n);m.dataset.seo=1;document.head.appendChild(m)}m.content=v}

if(tab==='ilan')h=D.listings.map((l,i)=>`<div class="panel"><label>Tür</label><select data-p="listings.${i}.kind"><option value="gayrimenkul"${l.kind==='gayrimenkul'?' selected':''}>Gayrimenkul</option><option value="proje"${l.kind==='proje'?' selected':''}>Proje</option></select>${F('Başlık',`listings.${i}.title`,l.title)}${F('Fiyat',`listings.${i}.price`,l.price)}${F('Açıklama (kart üzerindeki kısa metin)',`listings.${i}.desc`,l.desc,'area')}${F('Konum (örn. Torbalı, İzmir)',`listings.${i}.loc`,l.loc||'')}${F('Detay sayfası içeriği (## alt başlık, boş satırla paragraf, | ile tablo)',`listings.${i}.body`,l.body||'','big')}${F('Dipnot (sayfa sonunda küçük yazı)',`listings.${i}.note`,l.note||'','area')}${F('Video linki (YouTube veya Instagram, isteğe bağlı)',`listings.${i}.video`,l.video||'')}${F('Video başlığı (YouTube’daki başlık)',`listings.${i}.vtitle`,l.vtitle||'')}${F('Videonun yüklenme tarihi',`listings.${i}.vdate`,l.vdate||'','date')}${F('Video özeti (2-4 cümle, arama motorları için)',`listings.${i}.vdesc`,l.vdesc||'','area')}<label>Görseller (ilk görsel kapaktır, birden fazla seçebilirsiniz)</label><input type="file" accept="image/*" multiple onchange="upl(this,${i})">${(l.imgs||[]).map((m,j)=>`<div class="row" style="align-items:center;margin-top:8px"><div><img src="${m.s}" style="max-width:160px;border-radius:4px"></div><div>${F('Açıklama (alt metin)',`listings.${i}.imgs.${j}.a`,m.a||'')}<p><button class="btn sm" onclick="imgTop(${i},${j})">Kapak yap</button> <button class="btn sm danger" onclick="D.listings[${i}].imgs.splice(${j},1);go()">Kaldır</button></p></div></div>`).join('')}<div class="btns"><button class="btn sm danger" onclick="del('listings',${i})">Sil</button></div></div>`).join('')+`<button class="btn" onclick="add('listings')">+ Yeni ilan / proje</button>`;
if(tab==='sayfa')h=Object.keys(D.pages).map(k=>`<div class="panel"><b>${k}</b>${F('Başlık',`pages.${k}.title`,D.pages[k].title)}${F('İçerik',`pages.${k}.body`,D.pages[k].body,'big')}</div>`).join('');
if(tab==='guv')h=`<div class="panel"><b>Yönetim şifresi</b>${'<label>Yeni şifre (en az 8 karakter)</label><input id="npw" type="password" autocomplete="new-password">'}<div class="btns"><button class="btn sm" onclick="setpw()">Şifreyi değiştir</button></div><p style="color:var(--mu);font-size:13px">Değişiklik, Kaydet ve Yayınla'ya basınca kalıcı olur.</p></div>`;
if(tab==='seo'){const q=D.seo;h=`<div class="panel"><b>WhatsApp iletişim</b>${F('WhatsApp numarası (örn. 905321234567 veya 0532 123 45 67)','seo.whatsapp',q.whatsapp)}${F('Hazır mesaj (ziyaretçinin göndereceği ilk mesaj)','seo.waMsg',q.waMsg)}<p style="color:var(--mu);font-size:13px">Numara girilince sitede WhatsApp butonu, ilan kartlarında "Bilgi Al", makale ve İletişim sayfasında WhatsApp kutusu görünür. Boş bırakırsanız hiçbiri görünmez.</p></div><div class="panel"><b>SEO ve yerel arama (GEO)</b>${F('Ad Soyad (yapılandırılmış veri)','seo.person',q.person)}${F('Hizmet bölgesi / şehir','seo.city',q.city)}${F('Site açıklaması (meta description, 120-160 karakter)','seo.desc',q.desc,'area')}${F('Anahtar konular (virgülle ayırın)','seo.keywords',q.keywords)}<div class="row"><div>${F('Telefon','seo.phone',q.phone)}</div><div>${F('E-posta','seo.email',q.email)}</div></div>${F('Site adresi (yayın linkiniz / alan adınız)','seo.url',q.url)}</div><div class="panel"><b>İpuçları</b><p style="color:var(--mu)">• Makalenin ilk cümlesi soruyu doğrudan cevaplasın.<br>• Alt başlığı soru yazıp (## Ev değerleme nasıl yapılır?) altına cevap yazarsanız SSS olarak işaretlenir.<br>• Bölge ve semt adlarını geçirin (Beşiktaş, Boğaz...).<br>• Telefon ve e-posta girmek yerel aramada güven verir.</p></div>`}
if(tab==='gorsel')h=`<div class="panel"><b>Alıntı bölümü arka planı</b><label>Dosya seç</label><input type="file" accept="image/*" onchange="up(this,'quote',1600)"></div><div class="panel"><b>Hero arka planı (villa)</b><label>Dosya seç</label><input type="file" accept="image/*" onchange="up(this,'hero',1600)">${D.img.hero?`<p><button class="btn sm danger" onclick="D.img.hero='';go()">Kaldır</button></p>`:''}</div><div class="panel"><b>Portre (arka planı şeffaf PNG veya WebP)</b><label>Dosya seç</label><input type="file" accept="image/*" onchange="up(this,'portrait',900)">${D.img.portrait?`<p><button class="btn sm danger" onclick="D.img.portrait='';go()">Kaldır</button></p>`:''}</div>`;
return nav(['admin'])+`<main class="adm"><div class="wrap"><h1 class="serif" style="font-size:36px;margin:0 0 20px">Yönetim Paneli</h1><div class="tabs">${T.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';go()">${l}</button>`).join('')}</div>${h}<div class="bar"><button class="btn gold" onclick="save()">${standalone?'Kaydet (index.html indir)':'Kaydet ve Yayınla'}</button><a class="btn" href="/">Siteyi gör</a>${standalone?'':'<button class="btn" onclick="dl()">index.html indir</button>'}<button class="btn" onclick="lock()">Kilitle</button></div>${standalone?'<p style="color:var(--mu);font-size:13px">Kaydet\'e basınca güncel index.html bilgisayarınıza iner. Eski index.html\'in yerine koyup GitHub\'a yükleyin (Add file → Upload files).</p>':''}</div></main>`}
function go(){root.innerHTML=view()+'<div id="toast"></div>'+fab();seo()}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',8000)}
document.addEventListener('input',ev=>{const p=ev.target.dataset&&ev.target.dataset.p;if(!p)return;dirty=true;const k=p.split('.');let o=D;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=ev.target.value});
document.addEventListener('change',ev=>{if(ev.target.tagName==='SELECT'&&ev.target.dataset.p)ev.target.dispatchEvent(new Event('input',{bubbles:true}))});
const uid=()=>'x'+Math.random().toString(36).slice(2,8);
function add(c){dirty=true;D[c].unshift(c==='articles'?{id:uid(),title:'Yeni makale',cat:'Genel',date:new Date().toISOString().slice(0,10),summary:'',body:''}:{id:uid(),kind:'gayrimenkul',title:'Yeni ilan',price:'',desc:''});go()}
function del(c,i){if(confirm('Silinsin mi?')){dirty=true;D[c].splice(i,1);go()}}
const rs=(f,max,q)=>new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(f)});
async function upl(inp,i){dirty=true;const L=D.listings[i];L.imgs=L.imgs||[];for(const f of inp.files){L.imgs.push({s:await rs(f,1200,.72),a:''})}go();toast('Görseller eklendi, yayınlamayı unutmayın')}
function imgTop(i,j){dirty=true;const a=D.listings[i].imgs;a.unshift(a.splice(j,1)[0]);go()}
function upa(inp,i){dirty=true;const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);D.articles[i].img=c.toDataURL('image/jpeg',.8);go();toast('Görsel eklendi, yayınlamayı unutmayın')};im.src=r.result};r.readAsDataURL(f)}
function up(inp,key,max){dirty=true;const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);D.img[key]=key==='portrait'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.82);go();toast('Görsel eklendi, yayınlamayı unutmayın')};im.src=r.result};r.readAsDataURL(f)}
function buildHtml(){seo(['']);const c=document.documentElement.cloneNode(true);c.querySelector('#root').innerHTML='';c.querySelectorAll('noscript').forEach(n=>n.remove());c.querySelector('body').insertAdjacentHTML('afterbegin','<noscript>'+stat()+'</noscript>');c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');return '<!doctype html>\n'+c.outerHTML}
function dl(){const h=buildHtml();seo();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove();dirty=false;toast("index.html indirildi. Eski dosyanın yerine koyun ve GitHub'a yükleyin.")}
async function save(){
if(!art){if(standalone){dl();return}toast('Yayınlama yetkisi bulunamadı');return}
try{seo(['']);const c=document.documentElement.cloneNode(true);c.querySelector('#root').innerHTML='';c.querySelectorAll('noscript').forEach(n=>n.remove());c.querySelector('body').insertAdjacentHTML('afterbegin','<noscript>'+stat()+'</noscript>');
c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
const html='<!doctype html>\n'+c.outerHTML;await art.publish(html)}catch(x){toast('Kaydedilemedi: '+(x&&x.code||x&&x.message||'hata'))}}
function track(){if(!/^https?:$/.test(location.protocol)||route()[0]==='admin'||typeof gtag!=='function')return;gtag('event','page_view',{page_title:document.title,page_location:location.href,page_path:location.pathname})}
document.addEventListener('click',ev=>{const a=ev.target.closest&&ev.target.closest('a[href]');if(!a||typeof gtag!=='function'||!/^https?:$/.test(location.protocol))return;const h=a.getAttribute('href')||'';if(h.indexOf('https://wa.me/')===0)gtag('event','whatsapp_click',{link_url:h.split('?')[0],page_path:location.pathname});else if(h.indexOf('tel:')===0)gtag('event','phone_click',{page_path:location.pathname})});

addEventListener('load',()=>setTimeout(track,0));
go();
(async()=>{try{if(!window.claude)return;const u=await claude.use('user');canEdit=!!u&&u.canEdit();art=await claude.use('artifact');go()}catch(_){}})();
</script>
