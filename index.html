<body><noscript><header><h1>Meftun Özdemir - GAYRİMENKUL DANIŞMANI, İstanbul</h1><p>Gayrimenkulünüzü doğru şekilde değerlendirin. Satış, kiralama, gayrimenkul arayışı ve proje fırsatlarında profesyonel danışmanlık hizmeti sunuyorum.</p></header><main><h2>Gayrimenkul Rehberi</h2><article><h3>Beykoz Konut Piyasası 2025 Analizi: %58,91 Değer Artışıyla Zirvede!</h3><p>Piyasa Analizi · 2026-10-18</p><p>Beykoz %58,91 konut fiyat artışıyla İstanbul'un en çok kazandıran ilçesi oldu. Değer artışının nedenlerini ve yatırım fırsatlarını inceleyin.</p><p>İstanbul gayrimenkul piyasasının gizli şampiyonu Beykoz, son dönemde kaydettiği rekor yükselişlerle adından sıkça söz ettiriyor. Endeksa verilerine göre Beykoz, geçtiğimiz yıl gerçekleştirdiği %58,91'lik konut fiyat artış hızı ile İstanbul'un en çok kazandıran ilçesi olmayı başardı.</p><p>Peki, yatırımcıların ve konut alıcılarının odağındaki Beykoz'u bu kadar cazip kılan etkenler neler? Hangi bölgeler öne çıkıyor ve bu artışlar yatırımcılar için hâlâ bir fırsat mı?</p><h3>Beykoz'u Zirveye Taşıyan Temel Faktörler</h3><p>İstanbul genelinde gayrimenkul projeleri hız kesmeden devam ederken Beykoz, sunduğu yaşam standartlarıyla diğer ilçelerden ayrışıyor. Bu yükseliş trendinin arkasında yatan başlıca dinamikler şunlar:</p><p>• Zemin Sağlamlığı ve Güvenli Yaşam: Son yıllarda artan deprem bilinciyle birlikte, güvenli zemin yapısına sahip bölgelere olan talep katlanarak arttı. Beykoz, sağlam coğrafi yapısıyla güvenli bir yaşam arayanların ilk tercihi konumunda.<br>• Müstakil Yaşam Konforu: Şehrin karmaşasından uzaklaşmak, doğayla iç içe, müstakil ve geniş alanlarda yaşamak isteyen nitelikli kitle, yatırımlarını bu bölgeye yönlendiriyor.<br>• Eşsiz Boğaz Hattı ve Konum Avantajı: İstanbul Boğazı'nın benzersiz dokusunu yeşille buluşturan Beykoz, hem merkezi noktalara ulaşım kolaylığı hem de sakinliği bir arada sunuyor.</p><h3>Hem Konut Hem Arsalar Değer Kazanıyor</h3><p>Doğayla iç içe, güvenli ve prestijli bir yaşam arayışının merkezinde yer alan Beykoz'da, sadece konutlar değil arsalar da yüksek oranda prim yapıyor. Doğru mahalle ve doğru lokasyon seçimiyle yapılan yatırımlar, kısa ve orta vadede yatırımcısına yüksek kazanç vadetmeye devam ediyor.</p><p>Mevcut piyasa koşullarında mülkünüzün gerçek değerini öğrenmek, doğru bir satış stratejisi oluşturmak veya Beykoz gayrimenkul piyasasındaki en güncel fırsatları değerlendirmek istiyorsanız benimle iletişime geçebilirsiniz. Gelin, mülkünüzün potansiyelini birlikte değerlendirelim.</p></article><article><h3>Hisseli Tapu Metrekare Hesabı Nasıl Yapılır?</h3><p>Mülk Sahipleri · 2026-10-18</p><p>Hisseli tapuda pay ve payda hesaplama adımlarını öğrenin, toplam arsa alanınızdan size düşen net metrekareyi kolayca bulun.</p><p>Gayrimenkul sahipleri için hisseli tapulardaki metrekare payını hesaplamak bazen karmaşık görünebilir. Kendi payınıza düşen net alanı bulabilmeniz için tapu belgenizdeki rakamların ne anlama geldiğini bilmeniz yeterlidir.</p><h3>Hisseli Tapuda Pay ve Payda Mantığı</h3><p>Tapu üzerindeki &quot;pay&quot; ve &quot;payda&quot; değerleri, toplam arsa içerisindeki mülkiyet oranınızı ifade eder:</p><p>• Payda: Arsanın toplamda kaç eşit parçaya bölündüğünü gösterir.<br>• Pay: Bu parçalardan kaç tanesinin size ait olduğunu belirtir.</p><h3>Hisseli Tapu Metrekare Hesaplama Formülü</h3><p>Kendi mülkiyet payınızı hesaplamak için kullanılan temel formül şu şekildedir:</p><p>(Toplam Arsa Metrekaresi / Payda) x Pay = Net Hisse Alanınız (m²)</p><h3>Adım Adım Örnek Hesaplama</h3><p>Eğer toplam alanı 4.200 m² olan bir arsanız varsa ve tapunuzdaki oran 24 / 2500 olarak belirtilmişse, hesaplama şu şekilde yapılır:</p><p>1. Bölme İşlemi: Toplam arsa alanını payda değerine bölün.<br>4.200 / 2.500 = 1,68</p><p>2. Çarpma İşlemi: Çıkan sonucu pay değeriniz ile çarpın.<br>1,68 x 24 = 40,32 m² (Sizin net hisseniz)</p><p>Bu basit yöntem sayesinde herhangi bir hisseli tapuda kendi mülkiyet payınızı hızlıca hesaplayabilirsiniz.</p><h3>Hisseli tapu metrekare hesabı fiili kullanım alanını garanti eder mi?</h3><p>Hayır. Hisseli tapularda yapılan metrekare hesabı hukuki mülkiyet oranınızı gösterir. Arsanın hangi fiziki bölümünün size ait olduğu ancak hissedarlar arasında yapılan Rıza-i Taksim Sözleşmesi veya parselasyon ile netleşir.</p><h3>Tapudaki değerleri hesaplamakta zorlanıyorsam ne yapmalıyım?</h3><p>Eğer kendi tapunuzdaki değerleri hesaplamakta güçlük çekiyorsanız, arsa toplam metrekaresi ile pay ve payda bilgilerini paylaşarak profesyonel destek alabilir veya başkalarının deneyimlerinden faydalanabilirsiniz.</p></article><article><h3>Gayrimenkul Değerleme Nasıl Yapılır?</h3><p>Mülk Sahipleri · 2026-10-01</p><p>Doğru fiyatı belirlemenin 5 temel adımı.</p><p>Doğru fiyat, satış sürecinin en kritik kararıdır.</p><h3>1. Emsal analizi</h3><p>Bölgedeki benzer mülklerin gerçekleşen satış fiyatlarına bakın.</p><h3>2. Mülkün durumu</h3><p>Yaş, cephe, kat, bakım durumu ve manzara değeri etkiler.</p></article><article><h3>Ev Alırken Dikkat Edilecek 7 Nokta</h3><p>Alıcılar · 2026-09-20</p><p>Tapudan imara kadar kontrol listesi.</p><p>Satın almadan önce tapu, iskan ve imar durumunu mutlaka kontrol edin.</p><h3>Aidat ve giderler</h3><p>Aylık sabit giderleri bütçenize dahil edin.</p></article><article><h3>Proje Satın Alırken Riskler ve Fırsatlar</h3><p>Projeler · 2026-09-05</p><p>Müteahhit seçimi ve ödeme planı.</p><p>Projeden alım, doğru yapıldığında güçlü bir yatırımdır.</p><h3>Müteahhit geçmişi</h3><p>Tamamlanmış projeleri yerinde inceleyin.</p></article><h2>Gayrimenkuller ve Projeler</h2><section><h3>Boğaz Manzaralı Modern Villa</h3><p>₺ 85.000.000 5+2, havuzlu, 650 m² bahçe.</p></section><section><h3>Orman Vadisi Konutları</h3><p>₺ 12.500.000'den başlayan Teslim: 2028, 3 etaplı site projesi.</p></section><section><h2>Hakkımda</h2><p>Yıllardır gayrimenkul sektöründe mülk sahipleri ve alıcılara rehberlik ediyorum.</p><p>Yaklaşımım basit: doğru bilgi, şeffaf süreç ve size özel strateji.</p><h3>Hizmetlerim</h3><p>Satış, kiralama, değerl eleyin.","body":"İstanbul gayrimenkul piyasasının gizli şampiyonu Beykoz, son dönemde kaydettiği rekor yükselişlerle adından sıkça söz ettiriyor. Endeksa verilerine göre Beykoz, geçtiğimiz yıl gerçekleştirdiği %58,91'lik konut fiyat artış hızı ile İstanbul'un en çok kazandıran ilçesi olmayı başardı.\n\nPeki, yatırımcıların ve konut alıcılarının odağındaki Beykoz'u bu kadar cazip kılan etkenler neler? Hangi bölgeler öne çıkıyor ve bu artışlar yatırımcılar için hâlâ bir fırsat mı?\n\n## Beykoz'u Zirveye Taşıyan Temel Faktörler\n\nİstanbul genelinde gayrimenkul projeleri hız kesmeden devam ederken Beykoz, sunduğu yaşam standartlarıyla diğer ilçelerden ayrışıyor. Bu yükseliş trendinin arkasında yatan başlıca dinamikler şunlar:\n\n• Zemin Sağlamlığı ve Güvenli Yaşam: Son yıllarda artan deprem bilinciyle birlikte, güvenli zemin yapısına sahip bölgelere olan talep katlanarak arttı. Beykoz, sağlam coğrafi yapısıyla güvenli bir yaşam arayanların ilk tercihi konumunda.\n• Müstakil Yaşam Konforu: Şehrin karmaşasından uzaklaşmak, doğayla iç içe, müstakil ve geniş alanlarda yaşamak isteyen nitelikli kitle, yatırımlarını bu bölgeye yönlendiriyor.\n• Eşsiz Boğaz Hattı ve Konum Avantajı: İstanbul Boğazı'nın benzersiz dokusunu yeşille buluşturan Beykoz, hem merkezi noktalara ulaşım kolaylığı hem de sakinliği bir arada sunuyor.\n\n## Hem Konut Hem Arsalar Değer Kazanıyor\n\nDoğayla iç içe, güvenli ve prestijli bir yaşam arayışının merkezinde yer alan Beykoz'da, sadece konutlar değil arsalar da yüksek oranda prim yapıyor. Doğru mahalle ve doğru lokasyon seçimiyle yapılan yatırımlar, kısa ve orta vadede yatırımcısına yüksek kazanç vadetmeye devam ediyor.\n\nMevcut piyasa koşullarında mülkünüzün gerçek değerini öğrenmek, doğru bir satış stratejisi oluşturmak veya Beykoz gayrimenkul piyasasındaki en güncel fırsatları değerlendirmek istiyorsanız benimle iletişime geçebilirsiniz. Gelin, mülkünüzün potansiyelini birlikte değerlendirelim.","alt":"","img":"","video":"https://www.youtube.com/watch?v=Roty7e-Y28Y"},{"id":"hisseli-tapu-metrekare-hesabi","title":"Hisseli Tapu Metrekare Hesabı Nasıl Yapılır?","cat":"Mülk Sahipleri","date":"2026-10-18","summary":"Hisseli tapuda pay ve payda hesaplama adımlarını öğrenin, toplam arsa alanınızdan size düşen net metrekareyi kolayca bulun.","body":"Gayrimenkul sahipleri için hisseli tapulardaki metrekare payını hesaplamak bazen karmaşık görünebilir. Kendi payınıza düşen net alanı bulabilmeniz için tapu belgenizdeki rakamların ne anlama geldiğini bilmeniz yeterlidir.\n\n## Hisseli Tapuda Pay ve Payda Mantığı\n\nTapu üzerindeki \"pay\" ve \"payda\" değerleri, toplam arsa içerisindeki mülkiyet oranınızı ifade eder:\n\n• Payda: Arsanın toplamda kaç eşit parçaya bölündüğünü gösterir.\n• Pay: Bu parçalardan kaç tanesinin size ait olduğunu belirtir.\n\n## Hisseli Tapu Metrekare Hesaplama Formülü\n\nKendi mülkiyet payınızı hesaplamak için kullanılan temel formül şu şekildedir:\n\n(Toplam Arsa Metrekaresi / Payda) x Pay = Net Hisse Alanınız (m²)\n\n## Adım Adım Örnek Hesaplama\n\nEğer toplam alanı 4.200 m² olan bir arsanız varsa ve tapunuzdaki oran 24 / 2500 olarak belirtilmişse, hesaplama şu şekilde yapılır:\n\n1. Bölme İşlemi: Toplam arsa alanını payda değerine bölün.\n4.200 / 2.500 = 1,68\n\n2. Çarpma İşlemi: Çıkan sonucu pay değeriniz ile çarpın.\n1,68 x 24 = 40,32 m² (Sizin net hisseniz)\n\nBu basit yöntem sayesinde herhangi bir hisseli tapuda kendi mülkiyet payınızı hızlıca hesaplayabilirsiniz.\n\n## Hisseli tapu metrekare hesabı fiili kullanım alanını garanti eder mi?\n\nHayır. Hisseli tapularda yapılan metrekare hesabı hukuki mülkiyet oranınızı gösterir. Arsanın hangi fiziki bölümünün size ait olduğu ancak hissedarlar arasında yapılan Rıza-i Taksim Sözleşmesi veya parselasyon ile netleşir.\n\n## Tapudaki değerleri hesaplamakta zorlanıyorsam ne yapmalıyım?\n\nEğer kendi tapunuzdaki değerleri hesaplamakta güçlük çekiyorsanız, arsa toplam metrekaresi ile pay ve payda bilgilerini paylaşarak profesyonel destek alabilir veya başkalarının deneyimlerinden faydalanabilirsiniz.","alt":"","img":"","video":""},{"id":"a1","title":"Gayrimenkul Değerleme Nasıl Yapılır?","cat":"Mülk Sahipleri","date":"2026-10-01","summary":"Doğru fiyatı belirlemenin 5 temel adımı.","body":"Doğru fiyat, satış sürecinin en kritik kararıdır.\n\n## 1. Emsal analizi\n\nBölgedeki benzer mülklerin gerçekleşen satış fiyatlarına bakın.\n\n## 2. Mülkün durumu\n\nYaş, cephe, kat, bakım durumu ve manzara değeri etkiler."},{"id":"a2","title":"Ev Alırken Dikkat Edilecek 7 Nokta","cat":"Alıcılar","date":"2026-09-20","summary":"Tapudan imara kadar kontrol listesi.","body":"Satın almadan önce tapu, iskan ve imar durumunu mutlaka kontrol edin.\n\n## Aidat ve giderler\n\nAylık sabit giderleri bütçenize dahil edin."},{"id":"a3","title":"Proje Satın Alırken Riskler ve Fırsatlar","cat":"Projeler","date":"2026-09-05","summary":"Müteahhit seçimi ve ödeme planı.","body":"Projeden alım, doğru yapıldığında güçlü bir yatırımdır.\n\n## Müteahhit geçmişi\n\nTamamlanmış projeleri yerinde inceleyin."}],"listings":[{"id":"l1","kind":"gayrimenkul","title":"Boğaz Manzaralı Modern Villa","price":"₺ 85.000.000","desc":"5+2, havuzlu, 650 m² bahçe."},{"id":"l2","kind":"proje","title":"Orman Vadisi Konutları","price":"₺ 12.500.000'den başlayan","desc":"Teslim: 2028, 3 etaplı site projesi."}],"seo":{"person":"Meftun Özdemir","city":"İstanbul","desc":"İstanbul'da satış, kiralama, gayrimenkul değerleme ve proje danışmanlığı. Meftun Özdemir ile mülkünüzü doğru fiyatla değerlendirin.","keywords":"gayrimenkul danışmanı, satılık villa, gayrimenkul değerleme, proje danışmanlığı, kiralık daire","phone":"05360568250","email":"ozdemirmeftunist@gmail.com","url":"","whatsapp":"05360568250","waMsg":"Merhaba, gayrimenkul danışmanlığı hakkında bilgi almak istiyorum."},"admin":{"hash":"fbce6a1248d5d8fb177d8cd4d142f2e9829ab3f8c1a673d9cfeeee0732ed3826"}}</script>

function home(){const s=D.site,bg=D.img.hero?`background-image:url(${D.img.hero})`:'',qb=D.img.quote?`background-image:linear-gradient(rgba(21,21,21,.78),rgba(21,21,21,.92)),url(${D.img.quote});background-size:cover;background-position:center`:'';

<div class="strip"><div class="wrap">${['iletisim','gayrimenkuller','projeler','rehber'].map((h,i)=>`<a href="#/${h}">${e(s.strip[i])}</a>`).join('')}</div></div>

if(k==='rehber')return nav(['rehber'])+`<main class="page"><div class="wrap"><h1 class="serif">Gayrimenkul Rehberi</h1><div class="grid">${[...D.articles].sort((a,b)=>b.date.localeCompare(a.date)).map(card).join('')}</div></div></main>`+foot();
if(k==='gayrimenkuller'||k==='projeler'){const kind=k==='projeler'?'proje':'gayrimenkul';return nav([k])+`<main class="page"><div class="wrap"><h1 class="serif">${k==='projeler'?'Projeler':'Gayrimenkuller'}</h1><div class="grid">${D.listings.filter(l=>l.kind===kind).map(lcard).join('')||'<p>Henüz ilan yok.</p>'}</div></div></main>`+foot()}
if(D.pages[k]){const p=D.pages[k];return nav([k])+`<main class="page"><div class="wrap"><article><h1>${e(p.title)}</h1><div class="prose">${prose(p.body)}</div>${k==='iletisim'?waBtn():''}</article></div></main>`+foot()}
return home()}
/* ---------- video ---------- */
function vid(u){u=(u||'').trim();let m;
if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/))return{k:'yt',id:m[1],embed:'https://www.youtube-nocookie.com/embed/'+m[1]+'?autoplay=1&rel=0',link:'https://www.youtube.com/watch?v='+m[1]};
if(m=u.match(/instagram\.com\/(p|reel|tv)\/([\w-]+)/))return{k:'ig',id:m[2],embed:'https://www.instagram.com/'+m[1]+'/'+m[2]+'/embed',link:'https://www.instagram.com/'+m[1]+'/'+m[2]+'/'};
return null}
function vbox(a){const v=vid(a.video);if(!v)return '';const n=v.k==='yt'?'YouTube':'Instagram';
return `<section class="vid"><h2 class="serif" style="font-size:24px;margin:30px 0 12px">Video</h2><div class="vwrap${v.k==='ig'?' ig':''}"><button class="vplay" data-src="${e(v.embed)}" data-t="${e(a.title)}" onclick="playv(this)" aria-label="Videoyu oynat"><span>▶</span><small>${n} videosunu oynat</small></button></div><p style="margin:8px 0 0"><a href="${e(v.link)}" target="_blank" rel="noopener" style="color:var(--gold2)">Videoyu ${n}'da aç →</a></p></section>`}
function playv(b){const w=b.parentNode,f=document.createElement('iframe');f.src=b.dataset.src;f.title=b.dataset.t;f.allow='accelerometer; autoplay; encrypted-media; picture-in-picture';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';w.innerHTML='';w.appendChild(f)}

const WA='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.4-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.1-.1.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.1c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.2c-1.5 0-2.9-.4-4.1-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.200 8.200 0 1 1 12 20.200z"/></svg>';
function wa(m){let n=(D.seo.whatsapp||'').replace(/\D/g,'');if(!n)return '';if(n.length===11&&n[0]==='0')n='90'+n.slice(1);else if(n.length===10)n='90'+n;return 'https://wa.me/'+n+'?text='+encodeURIComponent(m||D.seo.waMsg)}
const lk=(m,f)=>{const u=wa(m);return u?`href="${u}" target="_blank" rel="noopener"`:`href="${f}"`};
const waBtn=m=>{const u=wa(m),p=(D.seo.phone||'').replace(/[^\d+]/g,'');return u||p?`<div class="cta"><p style="margin:0 0 14px;color:var(--gold2)">Sorularınız için hemen yazın, size en kısa sürede döneyim.</p><div class="btns" style="margin:0">${u?`<a class="btn wag" href="${u}" target="_blank" rel="noopener">${WA} WhatsApp ile Yaz</a>`:''}${p?`<a class="btn" href="tel:${p}">Ara</a>`:''}</div></div>`:''};

/* ---------- seo ---------- */
const strip=o=>JSON.stringify(o,(k,v)=>v===''||v==null||(Array.isArray(v)&&!v.length)?undefined:v).replace(/</g,'\\u003c');
function faq(b){const p=b.split(/\n\n+/),o=[];p.forEach((x,i)=>{if(x.startsWith('## ')&&x.trim().endsWith('?')&&p[i+1]&&!p[i+1].startsWith('## '))o.push({"@type":"Question","name":x.slice(3).trim(),"acceptedAnswer":{"@type":"Answer","text":p[i+1]}})});return o}
function ld(a,all){const s=D.site,q=D.seo,ag={"@type":["RealEstateAgent","LocalBusiness"],"@id":"#agent","name":q.person,"jobTitle":s.role,"description":q.desc,"url":q.url,"telephone":q.phone,"email":q.email,"areaServed":{"@type":"City","name":q.city},"address":{"@type":"PostalAddress","addressLocality":q.city,"addressCountry":"TR"},"knowsAbout":q.keywords.split(',').map(x=>x.trim()).filter(Boolean)};
const art=x=>({"@type":"Article","headline":x.title,"description":x.summary,"datePublished":x.date,"dateModified":x.date,"articleSection":x.cat,"inLanguage":"tr","author":{"@id":"#agent"},"publisher":{"@id":"#agent"},"mainEntityOfPage":q.url?q.url+'#/rehber/'+x.id:undefined});
const g=[ag,{"@type":"WebSite","name":q.person+' | '+s.role,"url":q.url,"inLanguage":"tr","publisher":{"@id":"#agent"}}];
if(a){g.push(art(a));const v=vid(a.video);if(v&&v.k==='yt')g.push({"@type":"VideoObject","name":a.title,"description":a.summary||a.title,"thumbnailUrl":'https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg',"uploadDate":a.date,"embedUrl":'https://www.youtube.com/embed/'+v.id,"contentUrl":v.link});const f=faq(a.body);if(f.length)g.push({"@type":"FAQPage","mainEntity":f});g.push({"@type":"BreadcrumbList","itemListElement":[["Ana Sayfa",""],["Rehber","rehber"],[a.title,"rehber/"+a.id]].map((x,i)=>({"@type":"ListItem","position":i+1,"name":x[0],"item":q.url?q.url+'#/'+x[1]:undefined}))})}
else if(all)D.articles.forEach(x=>g.push(art(x)));
return {"@context":"https://schema.org","@graph":g}}
function meta(n,v,p){const k=p?'property':'name';let m=document.querySelector('meta['+k+'="'+n+'"]');if(!m){m=document.createElement('meta');m.setAttribute(k,n);m.dataset.seo=1;document.head.appendChild(m)}m.content=v}
function seo(r){r=r||route();const q=D.seo,s=D.site;let t,d=q.desc,a=null;
if(r[0]==='rehber'&&r[1])a=D.articles.find(x=>x.id===r[1]);
if(a){t=a.title+' | '+q.person;d=a.summary||d}
else if(r[0]==='rehber')t='Gayrimenkul Rehberi | '+q.person;
else if(r[0]==='gayrimenkuller')t='Satılık ve Kiralık Gayrimenkuller - '+q.city+' | '+q.person;
else if(r[0]==='projeler')t='Yatırımlık Projeler - '+q.city+' | '+q.person;
else if(r[0]==='admin')t='Yönetim';
else if(D.pages[r[0]])t=D.pages[r[0]].title+' | '+q.person;
else t=q.person+' | '+s.role+' - '+q.city;
document.title=t;meta('description',d);meta('og:title',t,1);meta('og:description',d,1);meta('og:type',a?'article':'website',1);meta('og:locale','tr_TR',1);meta('robots',r[0]==='admin'?'noindex,nofollow':'index,follow');
if(q.url){let k=document.querySelector('link[rel=canonical]');if(!k){k=document.createElement('link');k.rel='canonical';k.dataset.seo=1;document.head.appendChild(k)}k.href=q.url;meta('og:url',q.url,1)}
let l=document.getElementById('ld');if(!l){l=document.createElement('script');l.id='ld';l.type='application/ld+json';l.dataset.seo=1;document.head.appendChild(l)}
l.textContent=strip(ld(a,!r[0]))}

function go(){root.innerHTML=view()+'<div id="toast"></div>'+fab();seo()}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',8000)}
document.addEventListener('input',ev=>{const p=ev.target.dataset&&ev.target.dataset.p;if(!p)return;const k=p.split('.');let o=D;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=ev.target.value});
document.addEventListener('change',ev=>{if(ev.target.tagName==='SELECT'&&ev.target.dataset.p)ev.target.dispatchEvent(new Event('input',{bubbles:true}))});
const uid=()=>'x'+Math.random().toString(36).slice(2,8);
function add(c){D[c].unshift(c==='articles'?{id:uid(),title:'Yeni makale',cat:'Genel',date:new Date().toISOString().slice(0,10),summary:'',body:''}:{id:uid(),kind:'gayrimenkul',title:'Yeni ilan',price:'',desc:''});go()}
function del(c,i){if(confirm('Silinsin mi?')){D[c].splice(i,1);go()}}
function upa(inp,i){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);D.articles[i].img=c.toDataURL('image/jpeg',.8);go();toast('Görsel eklendi, yayınlamayı unutmayın')};im.src=r.result};r.readAsDataURL(f)}
function up(inp,key,max){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);D.img[key]=key==='portrait'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.82);go();toast('Görsel eklendi, yayınlamayı unutmayın')};im.src=r.result};r.readAsDataURL(f)}
let ghMem=null;const ghDef={repo:'meftunozdemiracce-bot/site',br:'main',path:'index.html'};const ghGet=()=>{if(ghMem)return ghMem;try{return Object.assign({},ghDef,JSON.parse(localStorage.getItem('mo_gh')||'{}'))}catch(_){return Object.assign({},ghDef)}};
function ghSave(){const v=i=>document.getElementById(i).value.trim();const g={repo:v('gh_repo'),br:v('gh_br')||'main',path:v('gh_path')||'index.html',tok:v('gh_tok')};ghMem=g;try{localStorage.setItem('mo_gh',JSON.stringify(g));toast('GitHub ayarları bu tarayıcıya kaydedildi')}catch(_){toast('Tarayıcı kalıcı kaydetmeye izin vermedi; bu sekme açık kaldığı sürece geçerli')}}
async function ghPublish(html){const g=ghGet();if(!g.repo||!g.tok){tab='gh';go();toast('Önce GitHub bağlantısını girin');return}
const api='https://api.github.com/repos/'+g.repo+'/contents/'+(g.path||'index.html').split('/').map(encodeURIComponent).join('/'),H={Authorization:'Bearer '+g.tok,Accept:'application/vnd.github+json'};
toast('Yayınlanıyor...');
const r=await fetch(api+'?ref='+encodeURIComponent(g.br||'main')+'&_='+Date.now(),{headers:H,cache:'no-store'});let sha;
const em=async x=>{try{return (await x.clone().json()).message||''}catch(_){return ''}};
if(r.ok)sha=(await r.json()).sha;else if(r.status!==404){toast('GitHub hatası '+r.status+' - '+(await em(r))+' (depo, dal, token izinlerini kontrol edin)');return}
const bytes=new TextEncoder().encode(html);let bin='';for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
const put=sh=>fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H),cache:'no-store',body:JSON.stringify({message:'İçerik güncellemesi (yönetim paneli)',content:btoa(bin),sha:sh,branch:g.br||'main'})});
let w=await put(sha);
if(w.status===409||w.status===422){const r2=await fetch(api+'?ref='+encodeURIComponent(g.br||'main')+'&_='+Date.now(),{headers:H,cache:'no-store'});if(r2.ok)w=await put((await r2.json()).sha)}
toast(w.ok?'Yayınlandı. GitHub Pages 1-2 dakika içinde güncellenir.':'Kaydedilemedi, hata '+w.status+' - '+(await em(w)))}
function buildHtml(){seo(['']);const c=document.documentElement.cloneNode(true);c.querySelector('#root').innerHTML='';c.querySelectorAll('noscript').forEach(n=>n.remove());c.querySelector('body').insertAdjacentHTML('afterbegin','<noscript>'+stat()+'</noscript>');c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');return '<!doctype html>\n'+c.outerHTML}
function dl(){const h=buildHtml();seo();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove();toast("index.html indirildi. GitHub'da mevcut dosyanın yerine yükleyin.")}
async function save(){
if(!art&&!standalone){toast('Yayınlama yetkisi bulunamadı');return}
try{seo(['']);const c=document.documentElement.cloneNode(true);c.querySelector('#root').innerHTML='';c.querySelectorAll('noscript').forEach(n=>n.remove());c.querySelector('body').insertAdjacentHTML('afterbegin','<noscript>'+stat()+'</noscript>');
c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
const html='<!doctype html>\n'+c.outerHTML;if(art)await art.publish(html);else await ghPublish(html)}catch(x){toast('Kaydedilemedi: '+(x&&x.code||x&&x.message||'hata'))}}
addEventListener('hashchange',()=>{go();scrollTo(0,0)});
go();
(async()=>{try{if(!window.claude)return;const u=await claude.use('user');canEdit=!!u&&u.canEdit();art=await claude.use('artifact');go()}catch(_){}})();
</script>
