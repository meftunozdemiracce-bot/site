/* ---------- video ---------- */
function vid(u){u=(u||'').trim();let m;
if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/))return{k:'yt',id:m[1],embed:'https://www.youtube-nocookie.com/embed/'+m[1]+'?autoplay=1&rel=0',link:'https://www.youtube.com/watch?v='+m[1]};
if(m=u.match(/instagram\.com\/(p|reel|tv)\/([\w-]+)/))return{k:'ig',id:m[2],embed:'https://www.instagram.com/'+m[1]+'/'+m[2]+'/embed',link:'https://www.instagram.com/'+m[1]+'/'+m[2]+'/'};
return null}
function vbox(a){const v=vid(a.video);if(!v)return '';const n=v.k==='yt'?'YouTube':'Instagram';
return `<section class="vid"><h2 class="serif" style="font-size:24px;margin:30px 0 12px">Video</h2><div class="vwrap${v.k==='ig'?' ig':''}"><button class="vplay" data-src="${e(v.embed)}" data-t="${e(a.title)}" onclick="playv(this)" aria-label="Videoyu oynat"><span>▶</span><small>${n} videosunu oynat</small></button></div><p style="margin:8px 0 0"><a href="${e(v.link)}" target="_blank" rel="noopener" style="color:var(--gold2)">Videoyu ${n}'da aç →</a></p></section>`}
function playv(b){const w=b.parentNode,f=document.createElement('iframe');f.src=b.dataset.src;f.title=b.dataset.t;f.allow='accelerometer; autoplay; encrypted-media; picture-in-picture';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';w.innerHTML='';w.appendChild(f)}

const WA='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.4-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.1-.1.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.1c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.2c-1.5 0-2.9-.4-4.1-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.200 8.200 0 1 1 12 20.200z"/></svg>';
function wa(m){let n=(D.seo.whatsapp||'').replace(/\D/g,'');if(!n)return '';if(n.length===11&&n[0]==='0')n='90'+n.slice(1);else if(n.length===10)n='90'+n;return 'https://wa.me/'+n+'?text='+encodeURIComponent(m||D.seo.waMsg)}
const lk=(m,f)=>{const u=wa(m);return u?`href="${u}" target="_blank" rel="noopener"`:`href="${f}"`};

/* ---------- seo ---------- */
const strip=o=>JSON.stringify(o,(k,v)=>v===''||v==null||(Array.isArray(v)&&!v.length)?undefined:v).replace(/</g,'\\u003c');
function faq(b){const p=b.split(/\n\n+/),o=[];p.forEach((x,i)=>{if(x.startsWith('## ')&&x.trim().endsWith('?')&&p[i+1]&&!p[i+1].startsWith('## '))o.push({"@type":"Question","name":x.slice(3).trim(),"acceptedAnswer":{"@type":"Answer","text":p[i+1]}})});return o}
function ld(a,all){const s=D.site,q=D.seo,ag={"@type":["RealEstateAgent","LocalBusiness"],"@id":"#agent","name":q.person,"jobTitle":s.role,"description":q.desc,"url":q.url,"telephone":q.phone,"email":q.email,"areaServed":{"@type":"City","name":q.city},"address":{"@type":"PostalAddress","addressLocality":q.city,"addressCountry":"TR"},"knowsAbout":q.keywords.split(',').map(x=>x.trim()).filter(Boolean)};
const art=x=>({"@type":"Article","headline":x.title,"description":x.summary,"datePublished":x.date,"dateModified":x.date,"articleSection":x.cat,"inLanguage":"tr","author":{"@id":"#agent"},"publisher":{"@id":"#agent"},"mainEntityOfPage":q.url?q.url+'#/rehber/'+x.id:undefined});
const g=[ag,{"@type":"WebSite","name":q.person+' | '+s.role,"url":q.url,"inLanguage":"tr","publisher":{"@id":"#agent"}}];
if(a){g.push(art(a));const v=vid(a.video);if(v&&v.k==='yt')g.push({"@type":"VideoObject","name":a.title,"description":a.summary||a.title,"thumbnailUrl":'https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg',"uploadDate":a.date,"embedUrl":'https://www.youtube.com/embed/'+v.id,"contentUrl":v.link});const f=faq(a.body);if(f.length)g.push({"@type":"FAQPage","mainEntity":f});g.push({"@type":"BreadcrumbList","itemListElement":[["Ana Sayfa",""],["Rehber","rehber"],[a.title,"rehber/"+a.id]].map((x,i)=>({"@type":"ListItem","position":i+1,"name":x[0],"item":q.url?q.url+'#/'+x[1]:undefined}))})}
else if(all)D.articles.forEach(x=>g.push(art(x)));
return {"@context":"https://schema.org","@graph":g}}
function meta(n,v,p){const k=p?'property':'name';let m=document.querySelector('meta['+k+'="'+n+'"]');if(!m){m=document.createElement('meta');m.setAttribute(k,n);m.dataset.seo=1;document.head.appendChild(m)}m.content=v}
function seo(r){r=r||route();const q=D.seo,s=D.site;let t,d=q.desc,a=null;
if(r[0]==='rehber'&&r[1])a=D.articles.find(x=>x.id===r[1]);
if(a){t=a.title+' | '+q.person;d=a.summary||d}
else if(r[0]==='rehber')t='Gayrimenkul Rehberi | '+q.person;
else if(r[0]==='gayrimenkuller')t='Satılık ve Kiralık Gayrimenkuller - '+q.city+' | '+q.person;
else if(r[0]==='projeler')t='Yatırımlık Projeler - '+q.city+' | '+q.person;
else if(r[0]==='admin')t='Yönetim';
else if(D.pages[r[0]])t=D.pages[r[0]].title+' | '+q.person;
else t=q.person+' | '+s.role+' - '+q.city;
document.title=t;meta('description',d);meta('og:title',t,1);meta('og:description',d,1);meta('og:type',a?'article':'website',1);meta('og:locale','tr_TR',1);meta('robots',r[0]==='admin'?'noindex,nofollow':'index,follow');
if(q.url){let k=document.querySelector('link[rel=canonical]');if(!k){k=document.createElement('link');k.rel='canonical';k.dataset.seo=1;document.head.appendChild(k)}k.href=q.url;meta('og:url',q.url,1)}
let l=document.getElementById('ld');if(!l){l=document.createElement('script');l.id='ld';l.type='application/ld+json';l.dataset.seo=1;document.head.appendChild(l)}
l.textContent=strip(ld(a,!r[0]))}
function stat(){const s=D.site;return `<header><h1>${e(D.seo.person)} - ${e(s.role)}, ${e(D.seo.city)}</h1><p>${e(s.title)} ${e(s.sub)}</p></header><main><h2>Gayrimenkul Rehberi</h2>${D.articles.map(a=>`<article><h3>${e(a.title)}</h3><p>${e(a.cat)} · ${e(a.date)}</p><p>${e(a.summary)}</p>${prose(a.body)}</article>`).join('')}<h2>Gayrimenkuller ve Projeler</h2>${D.listings.map(l=>`<section><h3>${e(l.title)}</h3><p>${e(l.price)} ${e(l.desc)}</p></section>`).join('')}${Object.values(D.pages).map(p=>`<section><h2>${e(p.title)}</h2>${prose(p.body)}</section>`).join('')}</main>`}

if(tab==='guv')h=`<div class="panel"><b>Yönetim şifresi</b>${'<label>Yeni şifre (en az 8 karakter)</label><input id="npw" type="password" autocomplete="new-password">'}<div class="btns"><button class="btn sm" onclick="setpw()">Şifreyi değiştir</button></div><p style="color:var(--mu);font-size:13px">Değişiklik, Kaydet ve Yayınla'ya basınca kalıcı olur.</p></div>`;

function upa(inp,i){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);D.articles[i].img=c.toDataURL('image/jpeg',.8);go();toast('Görsel eklendi, yayınlamayı unutmayın')};im.src=r.result};r.readAsDataURL(f)}

function ghSave(){const v=i=>document.getElementById(i).value.trim();const g={repo:v('gh_repo'),br:v('gh_br')||'main',path:v('gh_path')||'index.html',tok:v('gh_tok')};try{localStorage.setItem('mo_gh',JSON.stringify(g));toast('GitHub ayarları bu tarayıcıya kaydedildi')}catch(_){toast('Tarayıcı kaydetmeye izin vermedi')}}
async function ghPublish(html){const g=ghGet();if(!g.repo||!g.tok){tab='gh';go();toast('Önce GitHub bağlantısını girin');return}
const api='https://api.github.com/repos/'+g.repo+'/contents/'+(g.path||'index.html').split('/').map(encodeURIComponent).join('/'),H={Authorization:'Bearer '+g.tok,Accept:'application/vnd.github+json'};
toast('Yayınlanıyor...');
const r=await fetch(api+'?ref='+encodeURIComponent(g.br||'main'),{headers:H});let sha;
if(r.ok)sha=(await r.json()).sha;else if(r.status!==404){toast('GitHub hatası '+r.status+': depo, dal ve token bilgisini kontrol edin');return}
const bytes=new TextEncoder().encode(html);let bin='';for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
const w=await fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify({message:'İçerik güncellemesi (yönetim paneli)',content:btoa(bin),sha:sha,branch:g.br||'main'})});
toast(w.ok?'Yayınlandı. GitHub Pages 1-2 dakika içinde güncellenir.':'Kaydedilemedi, hata '+w.status)}
