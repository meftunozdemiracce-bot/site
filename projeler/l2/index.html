<style>
:root{--bg:#151515;--bg2:#1f1d1b;--tx:#f4f1ec;--mu:#b9b3aa;--gold:#c9a77c;--gold2:#e7cfa6;--ln:#3a3631;--in:#101010;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151515}}
:root[data-theme="dark"]{--bg:#151515}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 Roboto,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.serif{font-family:'Playfair Display',Georgia,serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
nav.top{position:absolute;inset:0 0 auto 0;z-index:5;padding-top:env(safe-area-inset-top,0px)}
nav.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-top:26px;flex-wrap:wrap}
.logo{font-family:'Playfair Display',Georgia,serif;font-size:28px;letter-spacing:.5px;line-height:1}
.logo small{display:block;font:300 11px Roboto;letter-spacing:3px;margin-top:6px;color:var(--mu)}
.menu{display:flex;gap:0;overflow-x:auto;max-width:100%}
.menu a{padding:2px 16px;border-left:1px solid var(--mu);white-space:nowrap;font-size:17px}
.menu a:first-child{border:0}.menu a.on,.menu a:hover{color:var(--gold2)}
.hero{position:relative;min-height:660px;padding:170px 0 60px;background:#151515;overflow:hidden}.frame{position:absolute;top:0;right:0;height:100%;aspect-ratio:1073/640;overflow:hidden;z-index:0}.vbg{position:absolute;inset:0;background:linear-gradient(180deg,#2a3346,#0f1a14) center/cover no-repeat}.pt{position:absolute;left:57%;top:20%;width:40%;height:auto;display:block}
.hero:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#151515 0%,#151515 30%,rgba(21,21,21,.15) 62%,transparent)}
.hero .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1.2fr .8fr;align-items:end}
.eyebrow{color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;font-size:15px}
h1{font:400 clamp(38px,6vw,66px)/1.12 'Playfair Display',Georgia,serif;margin:10px 0 18px}
.lead{max-width:520px;color:#ddd8cf}
.btns{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-block;padding:14px 20px;border-radius:4px;border:1px solid var(--gold2);font-size:15px;cursor:pointer;background:none;color:var(--tx);font-family:inherit}
.btn.gold{background:linear-gradient(120deg,#b99566,#ead6b2);color:#1b1610;border-color:transparent;font-weight:500}
.portrait{align-self:end;justify-self:end;max-height:600px;max-width:100%;margin-bottom:-60px;position:relative}
.portrait img,.portrait svg{display:block;max-height:600px;max-width:100%;object-fit:contain}

birbirinden farklı olabilir. Bu rehberde kontrol sırasını, Beykoz'a özgü dikkat noktalarını ve en sık yapılan hataları bulacaksınız.\n\n## İmar Durumu Nedir ve Neden Önemlidir?\n\nİmar durumu, bir parselde ne yapılabileceğini belirleyen resmî bilgidir. Belediyenin verdiği imar durumu belgesinde genellikle şu bilgiler yer alır:\n\n• Parselin plan fonksiyonu (konut, ticaret, yeşil alan, tarım, koruma alanı vb.)\n• Emsal ve taban alanı oranları (yapılaşma yoğunluğu)\n• İzin verilen kat adedi ve yapı yüksekliği\n• Çekme mesafeleri (komşu parsel ve yola uzaklık)\n\nBu bilgileri bilmeden alınan bir arsada hayal ettiğiniz villa yapılamayabilir ya da çok daha küçük bir yapıya izin çıkabilir.\n\n## Beykoz'da İmar Durumunu Adım Adım Kontrol Etme\n\n1. Ada ve parsel numarasını öğrenin\nSatıcıdan veya tapu senedinden mahalle, ada ve parsel bilgisini alın. Her kontrol bu bilgiye dayanır.\n\n2. Güncel tapu kaydını inceleyin\nTapunun nitelik bölümünü (arsa, tarla, bahçe vb.) ve \"şerhler, beyanlar, rehinler\" kısmını okuyun. İpotek, haciz, irtifak hakkı veya kısıtlama varsa not alın.\n\n3. İmar durumu belgesini belediyeden alın\nBeykoz Belediyesi imar birimine ada ve parsel bilgisiyle başvurarak resmî imar durumu belgesini isteyin. İlandaki veya emlak ofisindeki sözlü bilgiyle yetinmeyin.\n\n4. Plan türünü ve koruma durumunu sorgulayın\nParselin hangi plana tabi olduğunu, Boğaziçi Kanunu veya kıyı mevzuatı kapsamında bir bölgede kalıp kalmadığını öğrenin. Koruma amaçlı planlarda yapılaşma koşulları çok daha sınırlıdır.\n\n5. Orman ve tarım arazisi kontrolü yapın\nBeykoz'da orman alanına komşu veya orman sınırına yakın parseller çoktur. Parselin orman sınırı içinde kalmadığından ve tarım vasfında olup olmadığından emin olun.\n\n6. Mevcut yapı varsa ruhsat ve iskân belgesini isteyin\nArsa üzerinde bina varsa yapı ruhsatı ve iskân (yapı kullanma izin belgesi) olup olmadığını kontrol edin. Belgesiz yapılar ileride yıkım, para cezası veya satış zorluğu yaratabilir.\n\n## Boğaz Koruma Alanı Neden Ayrı Bir Kontrol Gerektirir?\n\nBoğaz hattındaki parseller Boğaziçi Kanunu ve koruma amaçlı imar planlarına tabidir. Sahil şeridi, ön görünüm, arka görünüm ve etkilenme bölgeleri gibi alt bölgelerde izin verilen yapı türü, yükseklik ve arazi kullanımı birbirinden farklıdır. Kıyıya yakın parsellerde ayrıca kıyı mevzuatından doğan yapı yasakları olabilir.\n\nBu nedenle \"komşunun villası var, bende de yapılır\" düşüncesi risklidir. Her parselin planı ve ilgili koruma kurulu kararları ayrı ayrı incelenmelidir.\n\n## Alıcıların En Sık Yaptığı Hatalar\n\n• Sadece ilandaki bilgiye veya sözlü beyana güvenmek\n• İmar durumu belgesi almadan kapora veya senet vermek\n• Tarla vasıflı arazinin kolayca konuta çevrilebileceğini varsaymak\n• Tapudaki şerh ve beyan bölümünü okumamak\n• Hisseli tapunun kendi payı için ayrı bir yapılaşma hakkı vermediğini bilmemek\n• Koruma alanı ve orman sınırı kontrolünü atlamak\n\n## Beykoz'da imar durumu belgesi nereden alınır?\n\nİmar durumu belgesi, taşınmazın bulunduğu ilçenin belediyesinin imar ve şehircilik birimlerinden alınır. Beykoz'daki parseller için Beykoz Belediyesi'ne ada ve parsel bilgisiyle başvurmanız gerekir. Bazı bilgiler belediye ve bakanlığın çevrim içi sorgulama hizmetlerinden de görülebilir ama bağlayıcı olan resmî belgedir.\n\n## Boğaz koruma alanında villa yapılabilir mi?\n\nBu tamamen parselin hangi bölgede kaldığına ve geçerli koruma planına bağlıdır. Boğaziçi Kanunu kapsamındaki bölgelerde yapılaşma ciddi şekilde sınırlıdır, bazı parsellerde ise yeni yapı izni hiç verilmeyebilir. Satın almadan önce imar durumu belgesi ve plan notları mutlaka incelenmelidir.\n\n## Tarla vasıflı arazide ev yapılabilir mi?\n\nGenel kural olarak tarım arazilerinde konut yapımı sıkı şartlara bağlıdır ve her tarla için izin verilmez. Tapuda \"tarla\" yazması yapılaşma hakkı anlamına gelmez. Parselin imar planı içinde olup olmadığını ve yapılaşmaya izin verip vermediğini ilgili kurumlardan öğrenin.\n\n## Tapuda şerh ve beyan olması ne anlama gelir?\n\nŞerhler ve beyanlar, taşınmaz üzerindeki kısıtlamaları, haklar ve yükümlülükleri gösterir. İpotek, haciz, irtifak veya imar uygulamasına ilişkin kayıtlar buraya yazılabilir. Bunların satın alma sonrası size geçeceğini unutmayın, bu yüzden her kaydı anlayarak imzalayın.\n\n## Hisseli arsa alırken nelere dikkat edilmelidir?\n\nHisseli tapuda yalnızca belirli bir pay satın alırsınız, arsanın fiziken ayrılmış bir bölümünü değil. Payınıza düşen alanı pay ve payda oranından hesaplayabilirsiniz, ancak hangi bölümü kullanacağınız ortaklar arasındaki anlaşmayla veya ortaklığın giderilmesiyle belirlenir. Ayrıca hisseli satışlarda diğer paydaşların önalım (şufa) hakkı doğabilir, bu da satın alma sonrasında uyuşmazlık riski yaratır.\n\nBu yazı genel bilgilendirme amacıyla hazırlanmıştır ve yayın tarihi itibarıyla geçerlidir. İmar planları ve mevzuat değişebilir, bu nedenle satın almadan önce güncel imar durumu belgesini belediyeden almanız ve gerekirse bir avukata danışmanız önerilir. Beykoz'da bir arsa veya villa incelemek istiyorsanız benimle iletişime geçebilirsiniz.","alt":"","img":"","video":""},{"id":"beykoz-konut-piyasasi-2025-analizi","title":"Beykoz Konut Piyasası 2025 Analizi: %58,91 Değer Artışıyla Zirvede!","cat":"Piyasa Analizi","date":"2026-10-18","summary":"Beykoz %58,91 konut fiyat artışıyla İstanbul'un en çok kazandıran ilçesi oldu. Değer artışının nedenlerini ve yatırım fırsatlarını inceleyin.","body":"İstanbul gayrimenkul piyasasının gizli şampiyonu Beykoz, son dönemde kaydettiği rekor yükselişlerle adından sıkça söz ettiriyor. Endeksa verilerine göre Beykoz, geçtiğimiz yıl gerçekleştirdiği %58,91'lik konut fiyat artış hızı ile İstanbul'un en çok kazandıran ilçesi olmayı başardı.\n\nPeki, yatırımcıların ve konut alıcılarının odağındaki Beykoz'u bu kadar cazip kılan etkenler neler? Hangi bölgeler öne çıkıyor ve bu artışlar yatırımcılar için hâlâ bir fırsat mı?\n\n## Beykoz'u Zirveye Taşıyan Temel Faktörler\n\nİstanbul genelinde gayrimenkul projeleri hız kesmeden devam ederken Beykoz, sunduğu yaşam standartlarıyla diğer ilçelerden ayrışıyor. Bu yükseliş trendinin arkasında yatan başlıca dinamikler şunlar:\n\n• Zemin Sağlamlığı ve Güvenli Yaşam: Son yıllarda artan deprem bilinciyle birlikte, güvenli zemin yapısına sahip bölgelere olan talep katlanarak arttı. Beykoz, sağlam coğrafi yapısıyla güvenli bir yaşam arayanların ilk tercihi konumunda.\n• Müstakil Yaşam Konforu: Şehrin karmaşasından uzaklaşmak, doğayla iç içe, müstakil ve geniş alanlarda yaşamak isteyen nitelikli kitle, yatırımlarını bu bölgeye yönlendiriyor.\n• Eşsiz Boğaz Hattı ve Konum Avantajı: İstanbul Boğazı'nın benzersiz dokusunu yeşille buluşturan Beykoz, hem merkezi noktalara ulaşım kolaylığı hem de sakinliği bir arada sunuyor.\n\n## Hem Konut Hem Arsalar Değer Kazanıyor\n\nDoğayla iç içe, güvenli ve prestijli bir yaşam arayışının merkezinde yer alan Beykoz'da, sadece konutlar değil arsalar da yüksek oranda prim yapıyor. Doğru mahalle ve doğru lokasyon seçimiyle yapılan yatırımlar, kısa ve orta vadede yatırımcısına yüksek kazanç vadetmeye devam ediyor.\n\nMevcut piyasa koşullarında mülkünüzün gerçek değerini öğrenmek, doğru bir satış stratejisi oluşturmak veya Beykoz gayrimenkul piyasasındaki en güncel fırsatları değerlendirmek istiyorsanız benimle iletişime geçebilirsiniz. Gelin, mülkünüzün potansiyelini birlikte değerlendirelim.","alt":"","img":"","video":"https://www.youtube.com/watch?v=Roty7e-Y28Y"},{"id":"hisseli-tapu-metrekare-hesabi","title":"Hisseli Tapu Metrekare Hesabı Nasıl Yapılır?","cat":"Mülk Sahipleri","date":"2026-10-18","summary":"Hisseli tapuda pay ve payda hesaplama adımlarını öğrenin, toplam arsa alanınızdan size düşen net metrekareyi kolayca bulun.","body":"Gayrimenkul sahipleri için hisseli tapulardaki metrekare payını hesaplamak bazen karmaşık görünebilir. Kendi payınıza düşen net alanı bulabilmeniz için tapu belgenizdeki rakamların ne anlama geldiğini bilmeniz yeterlidir.\n\n## Hisseli Tapuda Pay ve Payda Mantığı\n\nTapu üzerindeki \"pay\" ve \"payda\" değerleri, toplam arsa içerisindeki mülkiyet oranınızı ifade eder:\n\n• Payda: Arsanın toplamda kaç eşit parçaya bölündüğünü gösterir.\n• Pay: Bu parçalardan kaç tanesinin size ait olduğunu belirtir.\n\n## Hisseli Tapu Metrekare Hesaplama Formülü\n\nKendi mülkiyet payınızı hesaplamak için kullanılan temel formül şu şekildedir:\n\n(Toplam Arsa Metrekaresi / Payda) x Pay = Net Hisse Alanınız (m²)\n\n## Adım Adım Örnek Hesaplama\n\nEğer toplam alanı 4.200 m² olan bir arsanız varsa ve tapunuzdaki oran 24 / 2500 olarak belirtilmişse, hesaplama şu şekilde yapılır:\n\n1. Bölme İşlemi: Toplam arsa alanını payda değerine bölün.\n4.200 / 2.500 = 1,68\n\n2. Çarpma İşlemi: Çıkan sonucu pay değeriniz ile çarpın.\n1,68 x 24 = 40,32 m² (Sizin net hisseniz)\n\nBu basit yöntem sayesinde herhangi bir hisseli tapuda kendi mülkiyet payınızı hızlıca hesaplayabilirsiniz.\n\n## Hisseli tapu metrekare hesabı fiili kullanım alanını garanti eder mi?\n\nHayır. Hisseli tapularda yapılan metrekare hesabı hukuki mülkiyet oranınızı gösterir. Arsanın hangi fiziki bölümünün size ait olduğu ancak hissedarlar arasında yapılan Rıza-i Taksim Sözleşmesi veya parselasyon ile netleşir.\n\n## Tapudaki değerleri hesaplamakta zorlanıyorsam ne yapmalıyım?\n\nEğer kendi tapunuzdaki değerleri hesaplamakta güçlük çekiyorsanız, arsa toplam metrekaresi ile pay ve payda bilgilerini paylaşarak profesyonel destek alabilir veya başkalarının deneyimlerinden faydalanabilirsiniz.","alt":"","img":"","video":""},{"id":"a1","title":"Gayrimenkul Değerleme Nasıl Yapılır?","cat":"Mülk Sahipleri","date":"2026-10-01","summary":"Doğru fiyatı belirlemenin 5 temel adımı.","body":"Doğru fiyat, satış sürecinin en kritik kararıdır.\n\n## 1. Emsal analizi\n\nBölgedeki benzer mülklerin gerçekleşen satış fiyatlarına bakın.\n\n## 2. Mülkün durumu\n\nYaş, cephe, kat, bakım durumu ve manzara değeri etkiler."},{"id":"a2","title":"Ev Alırken Dikkat Edilecek 7 Nokta","cat":"Alıcılar","date":"2026-09-20", son ödeme | 790.000 TL peşinat + 60 ay x 20.000 TL taksit |\n| 1+1 | 2.000.000 TL | 2.490.000 TL | 990.000 TL peşinat + 24 ay x 25.000 TL + 24. ayda 900.000 TL son ödeme | 990.000 TL peşinat + 60 ay x 25.000 TL taksit |\n\nFiyatlar lansman dönemine özeldir. Güncel fiyat, stok durumu ve ödeme planı için proje satış ekibinden teyit alınması gerekir.\n\n## Bu Proje Kimler İçin Uygun?\n\nKiralama geliri hedefleyen bireysel yatırımcılar, Pancar OSB ve çevresinde çalışan profesyoneller, düşük giriş maliyetli kompakt daire arayan portföy yatırımcıları ve site yaşamı olan pratik bir konut arayanlar için uygun bir seçenektir.\n\n## Proje Geliştiricisi\n\nNOVO Şirketler Grubu","note":"Görseller tasarım amaçlı temsili çizimlerdir. Fiyat, stok ve ödeme planı lansman dönemine aittir ve değişebilir, yayın tarihi itibarıyla geçerlidir. Kesin bilgi için proje satış ekibinden teyit alınız.","imgs":[{"s":"/assets/site-image-04.jpg","a":"NOVO City İzmir proje dış cephe görünümü, gün batımında palmiyeler ve havuz"},{"s":"/assets/site-image-05.jpg","a":"NOVO City İzmir açık havuz ve şezlonglu sosyal alan"},{"s":"/assets/site-image-06.jpg","a":"NOVO City İzmir bloklar arası iç avlu görünümü"},{"s":"/assets/site-image-07.jpg","a":"NOVO City İzmir cadde cephesi ve açık otopark"},{"s":"/assets/site-image-08.jpg","a":"NOVO City İzmir peyzajlı havuz başı ve oturma alanları"},{"s":"/assets/site-image-09.jpg","a":"NOVO City İzmir zemin kat bahçe ve teras alanları"},{"s":"/assets/site-image-10.jpg","a":"NOVO City İzmir kuş bakışı peyzajlı bahçe ve teraslar"}],"video":"https://www.youtube.com/shorts/q_6ZvZcq6Iw","vtitle":"1.5 Milyon TL'ye İzmir'de Daire Fırsatı!","vdate":"2026-10-18","vdesc":"Bu kısa video, NOVO CITY İZMİR projesinde 1,5 milyon TL'den başlayan peşin fiyatlı 1+0 daire fırsatını tanıtıyor. Proje Torbalı'da, Pancar OSB'ye komşu ve Aydın–İzmir Otobanı cephesinde yer alıyor."},{"id":"l1","kind":"gayrimenkul","title":"Boğaz Manzaralı Modern Villa","price":"₺ 85.000.000","desc":"5+2, havuzlu, 650 m² bahçe."},{"id":"l2","kind":"proje","title":"Orman Vadisi Konutları","price":"₺ 12.500.000'den başlayan","desc":"Teslim: 2028, 3 etaplı site projesi."}],"seo":{"person":"Meftun Özdemir","city":"İstanbul","desc":"İstanbul'da satış, kiralama, gayrimenkul değerleme ve proje danışmanlığı. Meftun Özdemir ile mülkünüzü doğru fiyatla değerlendirin.","keywords":"gayrimenkul danışmanı, satılık villa, gayrimenkul değerleme, proje danışmanlığı, kiralık daire","phone":"05360568250","email":"ozdemirmeftunist@gmail.com","url":"https://meftunozdemir.com","whatsapp":"05360568250","waMsg":"Merhaba, gayrimenkul danışmanlığı hakkında bilgi almak istiyorum."},"admin":{"hash":"fbce6a1248d5d8fb177d8cd4d142f2e9829ab3f8c1a673d9cfeeee0732ed3826"}}</script>

if(k==='rehber'&&r[1]){const a=D.articles.find(x=>x.id===r[1]);if(a)return nav(['rehber'])+`<main class="page"><div class="wrap"><article><p class="cat"><a href="/">Ana Sayfa</a> › <a href="/rehber">Rehber</a> · ${e(a.cat)} · <time datetime="${e(a.date)}">${e(a.date)}</time></p><h1>${e(a.title)}</h1><p class="lead" style="font-size:19px;color:var(--gold2)">${e(a.summary)}</p>${a.img?`<figure style="margin:0 0 28px"><img src="${a.img}" alt="${e(a.alt||a.title)}" style="display:block;width:100%;border-radius:8px"></figure>`:''}<div class="prose">${prose(a.body)}</div>${vbox(a)}${waBtn('Merhaba, "'+a.title+'" yazınızı okudum, görüşmek istiyorum.')}<p class="cat">Yazar: ${e(D.seo.person)} · ${e(D.site.role)} · ${e(D.seo.city)}</p><a class="btn sm" href="/rehber">← Rehber</a></article></div></main>`+foot()}
if(k==='rehber')return nav(['rehber'])+`<main class="page"><div class="wrap"><h1 class="serif">Gayrimenkul Rehberi</h1><div class="grid">${[...D.articles].sort((a,b)=>b.date.localeCompare(a.date)).map(card).join('')}</div></div></main>`+foot();
if((k==='projeler'||k==='gayrimenkuller')&&r[1]){const l=D.listings.find(x=>x.id===r[1]);if(l)return detail(l,k)}
if(k==='gayrimenkuller'||k==='projeler'){const kind=k==='projeler'?'proje':'gayrimenkul';return nav([k])+`<main class="page"><div class="wrap"><h1 class="serif">${k==='projeler'?'Projeler':'Gayrimenkuller'}</h1><div class="grid">${D.listings.filter(l=>l.kind===kind).map(lcard).join('')||'<p>Henüz ilan yok.</p>'}</div></div></main>`+foot()}
if(D.pages[k]){const p=D.pages[k];return nav([k])+`<main class="page"><div class="wrap"><article><h1>${e(p.title)}</h1><div class="prose">${prose(p.body)}</div>${k==='iletisim'?waBtn():''}</article></div></main>`+foot()}
return home()}
/* ---------- video ---------- */
function vid(u){u=(u||'').trim();let m;
if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/)){const sh=/youtube\.com\/shorts\//.test(u);return{k:'yt',short:sh,id:m[1],embed:'https://www.youtube-nocookie.com/embed/'+m[1]+'?autoplay=1&rel=0',link:'https://www.youtube.com/'+(sh?'shorts/':'watch?v=')+m[1]}};
if(m=u.match(/instagram\.com\/(p|reel|tv)\/([\w-]+)/))return{k:'ig',id:m[2],embed:'https://www.instagram.com/'+m[1]+'/'+m[2]+'/embed',link:'https://www.instagram.com/'+m[1]+'/'+m[2]+'/'};
return null}
function vbox(a){const v=vid(a.video);if(!v)return '';const n=v.k==='yt'?'YouTube':'Instagram';
return `<section class="vid"><h2 class="serif" style="font-size:24px;margin:30px 0 12px">Video</h2><div class="vwrap${v.k==='ig'?' ig':v.short?' vert':''}"><button class="vplay" data-src="${e(v.embed)}" data-t="${e(a.vtitle||a.title)}" onclick="playv(this)" aria-label="Videoyu oynat"><span>▶</span><small>${n} videosunu oynat</small></button></div><p style="margin:8px 0 0"><a href="${e(v.link)}" target="_blank" rel="noopener" style="color:var(--gold2)">Videoyu ${n}'da aç →</a></p></section>`}
function playv(b){const w=b.parentNode,f=document.createElement('iframe');f.src=b.dataset.src;f.title=b.dataset.t;f.allow='accelerometer; autoplay; encrypted-media; picture-in-picture';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';w.innerHTML='';w.appendChild(f)}
/* ---------- whatsapp ---------- */
const WA='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.4-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.1-.1.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.1c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.2c-1.5 0-2.9-.4-4.1-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.200 8.200 0 1 1 12 20.200z"/></svg>';
function wa(m){let n=(D.seo.whatsapp||'').replace(/\D/g,'');if(!n)return '';if(n.length===11&&n[0]==='0')n='90'+n.slice(1);else if(n.length===10)n='90'+n;return 'https://wa.me/'+n+'?text='+encodeURIComponent(m||D.seo.waMsg)}
const lk=(m,f)=>{const u=wa(m);return u?`href="${u}" target="_blank" rel="noopener"`:`href="${f}"`};
const waBtn=m=>{const u=wa(m),p=(D.seo.phone||'').replace(/[^\d+]/g,'');return u||p?`<div class="cta"><p style="margin:0 0 14px;color:var(--gold2)">Sorularınız için hemen yazın, size en kısa sürede döneyim.</p><div class="btns" style="margin:0">${u?`<a class="btn wag" href="${u}" target="_blank" rel="noopener">${WA} WhatsApp ile Yaz</a>`:''}${p?`<a class="btn" href="tel:${p}">Ara</a>`:''}</div></div>`:''};
const fab=()=>{const u=wa();return route()[0]!=='admin'&&u?`<a class="wa" href="${u}" target="_blank" rel="noopener" aria-label="WhatsApp ile iletişime geç">${WA}<span>WhatsApp</span></a>`:''};
/* ---------- seo ---------- */
const strip=o=>JSON.stringify(o,(k,v)=>v===''||v==null||(Array.isArray(v)&&!v.length)?undefined:v).replace(/</g,'\\u003c');
function faq(b){const p=b.split(/\n\n+/),o=[];p.forEach((x,i)=>{if(x.startsWith('## ')&&x.trim().endsWith('?')&&p[i+1]&&!p[i+1].startsWith('## '))o.push({"@type":"Question","name":x.slice(3).trim(),"acceptedAnswer":{"@type":"Answer","text":p[i+1]}})});return o}
function ld(a,all,L){const s=D.site,q=D.seo,ag={"@type":["RealEstateAgent","LocalBusiness"],"@id":"#agent","name":q.person,"jobTitle":s.role,"description":q.desc,"url":q.url,"telephone":q.phone,"email":q.email,"areaServed":{"@type":"City","name":q.city},"address":{"@type":"PostalAddress","addressLocality":q.city,"addressCountry":"TR"},"knowsAbout":q.keywords.split(',').map(x=>x.trim()).filter(Boolean)};
const art=x=>({"@type":"Article","headline":x.title,"description":x.summary,"datePublished":x.date,"dateModified":x.date,"articleSection":x.cat,"inLanguage":"tr","author":{"@id":"#agent"},"publisher":{"@id":"#agent"},"mainEntityOfPage":q.url?q.url+'/rehber/'+x.id:undefined});
const g=[ag,{"@type":"WebSite","name":q.person+' | '+s.role,"url":q.url,"inLanguage":"tr","publisher":{"@id":"#agent"}}];
if(a){g.push(art(a));const v=vid(a.video);if(v&&v.k==='yt')g.push({"@type":"VideoObject","name":a.title,"description":a.summary||a.title,"thumbnailUrl":'https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg',"uploadDate":a.date,"embedUrl":'https://www.youtube.com/embed/'+v.id,"contentUrl":v.link});const f=faq(a.body);if(f.length)g.push({"@type":"FAQPage","mainEntity":f});g.push({"@type":"BreadcrumbList","itemListElement":[["Ana Sayfa",""],["Rehber","rehber"],[a.title,"rehber/"+a.id]].map((x,i)=>({"@type":"ListItem","position":i+1,"name":x[0],"item":q.url?q.url+'/'+x[1]:undefined}))})}
else if(all)D.articles.forEach(x=>g.push(art(x)));
if(L){const v=vid(L.video);if(v&&v.k==='yt')g.push({"@type":"VideoObject","name":L.vtitle||L.title,"description":L.vdesc||L.desc,"thumbnailUrl":'https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg',"uploadDate":L.vdate||'2026-10-18',"embedUrl":'https://www.youtube.com/embed/'+v.id,"contentUrl":v.link})}
return {"@context":"https://schema.org","@graph":g}}
function meta(n,v,p){const k=p?'property':'name';let m=document.querySelector('meta['+k+'="'+n+'"]');if(!m){m=document.createElement('meta');m.setAttribute(k,n);m.dataset.seo=1;document.head.appendChild(m)}m.content=v}
function seo(r){r=r||route();const q=D.seo,s=D.site;let t,d=q.desc,a=null;
if(r[0]==='rehber'&&r[1])a=D.articles.find(x=>x.id===r[1]);
const L=(r[0]==='projeler'||r[0]==='gayrimenkuller')&&r[1]?D.listings.find(x=>x.id===r[1]):null;
if(L){t=L.title+' | '+q.person;d=L.desc||d}else if(a){t=a.title+' | '+q.person;d=a.summary||d}
else if(r[0]==='rehber')t='Gayrimenkul Rehberi | '+q.person;
else if(r[0]==='gayrimenkuller')t='Satılık ve Kiralık Gayrimenkuller - '+q.city+' | '+q.person;
else if(r[0]==='projeler')t='Yatırımlık Projeler - '+q.city+' | '+q.person;
else if(r[0]==='admin')t='Yönetim';
else if(D.pages[r[0]])t=D.pages[r[0]].title+' | '+q.person;
else t=q.person+' | '+s.role+' - '+q.city;
document.title=t;meta('description',d);meta('og:title',t,1);meta('og:description',d,1);meta('og:type',a?'article':'website',1);meta('og:locale','tr_TR',1);meta('robots',r[0]==='admin'?'noindex,nofollow':'index,follow');
if(q.url){let k=document.querySelector('link[rel=canonical]');if(!k){k=document.createElement('link');k.rel='canonical';k.dataset.seo=1;document.head.appendChild(k)}const u=q.url+(location.pathname==='/'?'':location.pathname);k.href=u;meta('og:url',u,1)}
let l=document.getElementById('ld');if(!l){l=document.createElement('script');l.id='ld';l.type='application/ld+json';l.dataset.seo=1;document.head.appendChild(l)}
l.textContent=strip(ld(a,!r[0],L))}
function stat(){const s=D.site;return `<header><h1>${e(D.seo.person)} - ${e(s.role)}, ${e(D.seo.city)}</h1><p>${e(s.title)} ${e(s.sub)}</p></header><main><h2>Gayrimenkul Rehberi</h2>${D.articles.map(a=>`<article><h3>${e(a.title)}</h3><p>${e(a.cat)} · ${e(a.date)}</p><p>${e(a.summary)}</p>${prose(a.body)}</article>`).join('')}<h2>Gayrimenkuller ve Projeler</h2>${D.listings.map(l=>`<section><h3>${e(l.title)}</h3><p>${e(l.price)} ${e(l.desc)}</p>${prose(l.body||'')}</section>`).join('')}${Object.values(D.pages).map(p=>`<section><h2>${e(p.title)}</h2>${prose(p.body)}</section>`).join('')}</main>`}

if(tab==='sayfa')h=Object.keys(D.pages).map(k=>`<div class="panel"><b>${k}</b>${F('Başlık',`pages.${k}.title`,D.pages[k].title)}${F('İçerik',`pages.${k}.body`,D.pages[k].body,'big')}</div>`).join('');
if(tab==='guv')h=`<div class="panel"><b>Yönetim şifresi</b>${'<label>Yeni şifre (en az 8 karakter)</label><input id="npw" type="password" autocomplete="new-password">'}<div class="btns"><button class="btn sm" onclick="setpw()">Şifreyi değiştir</button></div><p style="color:var(--mu);font-size:13px">Değişiklik, Kaydet ve Yayınla'ya basınca kalıcı olur.</p></div>`;
if(tab==='seo'){const q=D.seo;h=`<div class="panel"><b>WhatsApp iletişim</b>${F('WhatsApp numarası (örn. 905321234567 veya 0532 123 45 67)','seo.whatsapp',q.whatsapp)}${F('Hazır mesaj (ziyaretçinin göndereceği ilk mesaj)','seo.waMsg',q.waMsg)}<p style="color:var(--mu);font-size:13px">Numara girilince sitede WhatsApp butonu, ilan kartlarında "Bilgi Al", makale ve İletişim sayfasında WhatsApp kutusu görünür. Boş bırakırsanız hiçbiri görünmez.</p></div><div class="panel"><b>SEO ve yerel arama (GEO)</b>${F('Ad Soyad (yapılandırılmış veri)','seo.person',q.person)}${F('Hizmet bölgesi / şehir','seo.city',q.city)}${F('Site açıklaması (meta description, 120-160 karakter)','seo.desc',q.desc,'area')}${F('Anahtar konular (virgülle ayırın)','seo.keywords',q.keywords)}<div class="row"><div>${F('Telefon','seo.phone',q.phone)}</div><div>${F('E-posta','seo.email',q.email)}</div></div>${F('Site adresi (yayın linkiniz / alan adınız)','seo.url',q.url)}</div><div class="panel"><b>İpuçları</b><p style="color:var(--mu)">• Makalenin ilk cümlesi soruyu doğrudan cevaplasın.<br>• Alt başlığı soru yazıp (## Ev değerleme nasıl yapılır?) altına cevap yazarsanız SSS olarak işaretlenir.<br>• Bölge ve semt adlarını geçirin (Beşiktaş, Boğaz...).<br>• Telefon ve e-posta girmek yerel aramada güven verir.</p></div>`}
if(tab==='gorsel')h=`<div class="panel"><b>Alıntı bölümü arka planı</b><label>Dosya seç</label><input type="file" accept="image/*" onchange="up(this,'quote',1600)"></div><div class="panel"><b>Hero arka planı (villa)</b><label>Dosya seç</label><input type="file" accept="image/*" onchange="up(this,'hero',1600)">${D.img.hero?`<p><button class="btn sm danger" onclick="D.img.hero='';go()">Kaldır</button></p>`:''}</div><div class="panel"><b>Portre (arka planı şeffaf PNG veya WebP)</b><label>Dosya seç</label><input type="file" accept="image/*" onchange="up(this,'portrait',900)">${D.img.portrait?`<p><button class="btn sm danger" onclick="D.img.portrait='';go()">Kaldır</button></p>`:''}</div>`;

document.addEventListener('input',ev=>{const p=ev.target.dataset&&ev.target.dataset.p;if(!p)return;dirty=true;const k=p.split('.');let o=D;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=ev.target.value});

const uid=()=>'x'+Math.random().toString(36).slice(2,8);
function add(c){dirty=true;D[c].unshift(c==='articles'?{id:uid(),title:'Yeni makale',cat:'Genel',date:new Date().toISOString().slice(0,10),summary:'',body:''}:{id:uid(),kind:'gayrimenkul',title:'Yeni ilan',price:'',desc:''});go()}
function del(c,i){if(confirm('Silinsin mi?')){dirty=true;D[c].splice(i,1);go()}}
const rs=(f,max,q)=>new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(f)});
async function upl(inp,i){dirty=true;const L=D.listings[i];L.imgs=L.imgs||[];for(const f of inp.files){L.imgs.push({s:await rs(f,1200,.72),a:''})}go();toast('Görseller eklendi, yayınlamayı unutmayın')}
function imgTop(i,j){dirty=true;const a=D.listings[i].imgs;a.unshift(a.splice(j,1)[0]);go()}
function upa(inp,i){dirty=true;const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);D.articles[i].img=c.toDataURL('image/jpeg',.8);go();toast('Görsel eklendi, yayınlamayı unutmayın')};im.src=r.result};r.readAsDataURL(f)}
function up(inp,key,max){dirty=true;const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);D.img[key]=key==='portrait'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.82);go();toast('Görsel eklendi, yayınlamayı unutmayın')};im.src=r.result};r.readAsDataURL(f)}
